<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prinz Lucas' Abenteuer</title>
<style>
  html,body{margin:0;padding:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;}
  #wrap{position:relative;width:800px;height:500px;box-shadow:0 0 30px #000;}
  canvas{display:block;background:#000;image-rendering:auto;}
  #hint{position:absolute;bottom:-22px;left:0;color:#888;font-size:12px;width:100%;text-align:center;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="500"></canvas>
  <div id="hint">Pfeile/WASD: Bewegen &amp; Springen (Doppelsprung) | Z/X: Angriff | I/Tab: Inventar | 1-5: Tränke</div>
</div>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;
const GRAVITY = 0.6;

// ---------- Utilities ----------
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rectsOverlap(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}
function rand(a,b){return a+Math.random()*(b-a);}

const RARITY = {
  common:{name:'Gewöhnlich',color:'#cccccc'},
  uncommon:{name:'Ungewöhnlich',color:'#4caf50'},
  rare:{name:'Selten',color:'#2196f3'},
  epic:{name:'Episch',color:'#9c27b0'},
  legendary:{name:'Legendär',color:'#ff9800'}
};

// ---------- Item definitions ----------
const ITEM_DEFS = {
  // weapons
  holzschwert:{id:'holzschwert',type:'weapon',name:'Holzschwert',atk:5,rarity:'common',glow:null,blade:'#a9743b'},
  eisenschwert:{id:'eisenschwert',type:'weapon',name:'Eisenschwert',atk:15,rarity:'uncommon',glow:null,blade:'#cfd8dc'},
  stahlschwert:{id:'stahlschwert',type:'weapon',name:'Stahlschwert',atk:25,rarity:'rare',glow:null,blade:'#eceff1'},
  magiestab:{id:'magiestab',type:'weapon',name:'Magiestab',atk:35,rarity:'epic',glow:'#2196f3',blade:'#8bd0ff'},
  drachenschwert:{id:'drachenschwert',type:'weapon',name:'Drachenschwert',atk:50,rarity:'legendary',glow:'#9c27b0',blade:'#c77dff'},
  // armor
  lederruestung:{id:'lederruestung',type:'armor',name:'Lederrüstung',def:5,rarity:'common',color:'#8d5524'},
  kettenhemd:{id:'kettenhemd',type:'armor',name:'Kettenhemd',def:12,rarity:'uncommon',color:'#9e9e9e'},
  ritterruestung:{id:'ritterruestung',type:'armor',name:'Ritterrüstung',def:20,rarity:'rare',color:'#b0bec5'},
  koenigsruestung:{id:'koenigsruestung',type:'armor',name:'Königsrüstung',def:30,rarity:'epic',color:'#ffd54f'},
  drachenruestung:{id:'drachenruestung',type:'armor',name:'Drachenrüstung',def:45,rarity:'legendary',color:'#7e57c2'},
  // potions
  kleinerheil:{id:'kleinerheil',type:'potion',name:'Kleiner Heiltrank',heal:25,rarity:'common',color:'#ff6b6b'},
  mittlererheil:{id:'mittlererheil',type:'potion',name:'Mittlerer Heiltrank',heal:50,rarity:'uncommon',color:'#e53935'},
  grosserheil:{id:'grosserheil',type:'potion',name:'Großer Heiltrank',heal:100,rarity:'rare',color:'#b71c1c'},
  staerketrank:{id:'staerketrank',type:'potion',name:'Stärketrank',buffAtk:10,buffTime:600,rarity:'rare',color:'#ffb300'},
};

function lootForEnemy(type){
  // returns array of item ids (+ gold handled separately)
  switch(type){
    case 'slime': return Math.random()<0.7?['kleinerheil']:[];
    case 'goblin': {
      let out=[]; if(Math.random()<0.4) out.push(pick(['holzschwert','lederruestung','kleinerheil']));
      return out;
    }
    case 'skeleton': {
      let out=[]; if(Math.random()<0.5) out.push(pick(['eisenschwert','kettenhemd','mittlererheil']));
      return out;
    }
    case 'darkknight': {
      let out=[]; if(Math.random()<0.7) out.push(pick(['stahlschwert','ritterruestung','grosserheil','staerketrank']));
      return out;
    }
    case 'troll': {
      let out=['grosserheil']; if(Math.random()<0.8) out.push(pick(['stahlschwert','magiestab','koenigsruestung','ritterruestung']));
      return out;
    }
    case 'dragon': {
      return [pick(['drachenschwert','drachenruestung']), 'grosserheil','staerketrank', pick(['magiestab','koenigsruestung'])];
    }
  }
  return [];
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ---------- Inventory ----------
const Inventory = {
  items:[], // {id, count} for stacks of potions; equipment single
  gold:0,
  weapon:null, // id
  armor:null,  // id
  maxSlots:20,
  reset(){
    this.items=[]; this.gold=0; this.weapon='holzschwert'; this.armor=null;
  },
  add(id){
    const def=ITEM_DEFS[id];
    if(!def) return false;
    if(def.type==='potion'){
      let s=this.items.find(it=>it.id===id);
      if(s){s.count++;return true;}
    }
    if(this.items.length>=this.maxSlots) return false;
    this.items.push({id,count:1});
    return true;
  },
  remove(idx){ this.items.splice(idx,1); },
  totalAtk(){ return (this.weapon?ITEM_DEFS[this.weapon].atk:0); },
  totalDef(){ return (this.armor?ITEM_DEFS[this.armor].def:0); },
};

// ---------- Drawing item icons ----------
function drawItemIcon(g,id,x,y,size){
  const def=ITEM_DEFS[id]; if(!def)return;
  g.save(); g.translate(x,y);
  const s=size;
  if(def.type==='weapon'){
    // sword
    g.save();
    g.translate(s*0.5,s*0.5); g.rotate(-Math.PI/4);
    if(def.glow){ g.shadowColor=def.glow; g.shadowBlur=10; }
    // blade
    g.fillStyle=def.blade;
    g.fillRect(-s*0.06,-s*0.42,s*0.12,s*0.55);
    g.beginPath(); g.moveTo(-s*0.06,-s*0.42); g.lineTo(0,-s*0.5); g.lineTo(s*0.06,-s*0.42); g.fill();
    g.shadowBlur=0;
    // guard
    g.fillStyle='#5d4037'; g.fillRect(-s*0.18,s*0.1,s*0.36,s*0.07);
    // handle
    g.fillStyle='#3e2723'; g.fillRect(-s*0.05,s*0.17,s*0.1,s*0.18);
    g.fillStyle='#ffca28'; g.beginPath(); g.arc(0,s*0.36,s*0.05,0,7); g.fill();
    g.restore();
  } else if(def.type==='armor'){
    g.fillStyle=def.color;
    g.beginPath();
    g.moveTo(s*0.2,s*0.2); g.lineTo(s*0.35,s*0.15); g.lineTo(s*0.5,s*0.25);
    g.lineTo(s*0.65,s*0.15); g.lineTo(s*0.8,s*0.2);
    g.lineTo(s*0.72,s*0.8); g.lineTo(s*0.28,s*0.8); g.closePath(); g.fill();
    g.strokeStyle='rgba(0,0,0,0.3)'; g.lineWidth=2; g.stroke();
    g.fillStyle='rgba(255,255,255,0.25)'; g.fillRect(s*0.46,s*0.25,s*0.08,s*0.5);
  } else if(def.type==='potion'){
    // bottle
    g.fillStyle='rgba(255,255,255,0.25)';
    g.fillRect(s*0.42,s*0.12,s*0.16,s*0.12);
    g.fillStyle=def.color;
    g.beginPath();
    g.moveTo(s*0.38,s*0.28); g.lineTo(s*0.62,s*0.28);
    g.quadraticCurveTo(s*0.78,s*0.5,s*0.72,s*0.7);
    g.quadraticCurveTo(s*0.6,s*0.85,s*0.5,s*0.85);
    g.quadraticCurveTo(s*0.4,s*0.85,s*0.28,s*0.7);
    g.quadraticCurveTo(s*0.22,s*0.5,s*0.38,s*0.28);
    g.fill();
    g.fillStyle='rgba(255,255,255,0.4)'; g.beginPath(); g.arc(s*0.43,s*0.55,s*0.05,0,7); g.fill();
    g.fillStyle='#6d4c41'; g.fillRect(s*0.42,s*0.08,s*0.16,s*0.07);
  }
  g.restore();
}

// ---------- Floating texts & messages ----------
let floaters=[]; // {x,y,text,color,life,vy}
function addFloater(x,y,text,color){ floaters.push({x,y,text,color:color||'#fff',life:60,vy:-1.2}); }
let messages=[]; // {text,life}
function addMessage(text){ messages.push({text,life:180}); if(messages.length>4)messages.shift(); }

// ---------- Player ----------
class Player {
  constructor(){ this.reset(); }
  reset(){
    this.x=80; this.y=300; this.w=34; this.h=46;
    this.vx=0; this.vy=0; this.onGround=false; this.facing=1;
    this.jumps=0; this.maxHp=100; this.hp=100;
    this.attacking=0; this.attackCd=0; this.invuln=0;
    this.buffAtk=0; this.buffTimer=0; this.walkPhase=0;
  }
  get atk(){ return 5 + Inventory.totalAtk() + this.buffAtk; }
  get def(){ return Inventory.totalDef(); }
  update(level){
    const sp=4.2;
    if(keys.left){ this.vx=-sp; this.facing=-1; }
    else if(keys.right){ this.vx=sp; this.facing=1; }
    else this.vx*=0.7;
    this.vy+=GRAVITY; if(this.vy>16)this.vy=16;
    // horizontal
    this.x+=this.vx;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){ if(this.vx>0)this.x=p.x-this.w; else if(this.vx<0)this.x=p.x+p.w; this.vx=0; } }
    // vertical
    this.y+=this.vy; this.onGround=false;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){
      if(this.vy>0){ this.y=p.y-this.h; this.vy=0; this.onGround=true; this.jumps=0; }
      else if(this.vy<0){ this.y=p.y+p.h; this.vy=0; }
    }}
    this.x=clamp(this.x,0,level.width-this.w);
    if(this.y>H+200){ this.hp=0; }
    if(Math.abs(this.vx)>0.5 && this.onGround) this.walkPhase+=0.25; else this.walkPhase=0;
    if(this.attacking>0)this.attacking--;
    if(this.attackCd>0)this.attackCd--;
    if(this.invuln>0)this.invuln--;
    if(this.buffTimer>0){ this.buffTimer--; if(this.buffTimer===0)this.buffAtk=0; }
  }
  jump(){ if(this.jumps<2){ this.vy=-11.5; this.jumps++; this.onGround=false; } }
  attack(){
    if(this.attackCd>0)return;
    this.attacking=14; this.attackCd=24;
    const reach=46;
    const hb={x:this.facing>0?this.x+this.w:this.x-reach, y:this.y-4, w:reach, h:this.h+8};
    for(const e of Game.enemies){ if(e.dead)continue;
      if(rectsOverlap(hb,e)){
        const dmg=this.atk + Math.floor(rand(-2,3));
        e.takeDamage(dmg);
        e.vx += this.facing*4; e.vy=-3;
      }
    }
  }
  hurt(dmg){
    if(this.invuln>0)return;
    const real=Math.max(1, dmg - Math.floor(this.def*0.6));
    this.hp-=real; this.invuln=50;
    addFloater(this.x+this.w/2,this.y,'-'+real,'#ff5252');
    if(this.hp<=0){ this.hp=0; }
  }
  draw(g,cam){
    const x=this.x-cam, y=this.y;
    if(this.invuln>0 && Math.floor(this.invuln/4)%2===0) g.globalAlpha=0.5;
    g.save(); g.translate(x+this.w/2,y);
    if(this.facing<0)g.scale(-1,1);
    g.translate(-this.w/2,0);
    const cx=this.w/2;
    const legSwing=Math.sin(this.walkPhase)*4;
    // legs (red pants)
    g.fillStyle='#d32f2f';
    g.fillRect(cx-9, 30, 8, 12+legSwing*0.5);
    g.fillRect(cx+1, 30, 8, 12-legSwing*0.5);
    // shoes
    g.fillStyle='#37474f';
    g.fillRect(cx-10, 40+legSwing*0.5, 10, 6);
    g.fillRect(cx+0, 40-legSwing*0.5, 10, 6);
    // yellow star on pants
    drawStar(g,cx-5,33,3,'#ffd600');
    // body - blue shirt with armor tint if equipped
    g.fillStyle = Inventory.armor? ITEM_DEFS[Inventory.armor].color : '#1976d2';
    g.fillRect(cx-11, 14, 22, 18);
    // fire truck pattern
    if(!Inventory.armor){
      g.fillStyle='#ff5722';
      g.fillRect(cx-8,18,5,3); g.fillRect(cx+3,18,5,3); g.fillRect(cx-2,25,5,3);
      g.fillStyle='#ffeb3b'; g.fillRect(cx-7,19,1.4,1.4); g.fillRect(cx+4,19,1.4,1.4); g.fillRect(cx-1,26,1.4,1.4);
    } else {
      g.fillStyle='rgba(255,255,255,0.2)'; g.fillRect(cx-3,16,6,14);
    }
    // arms
    g.fillStyle = Inventory.armor? ITEM_DEFS[Inventory.armor].color : '#1976d2';
    g.fillRect(cx-14,16,5,12); g.fillRect(cx+9,16,5,12);
    // hands
    g.fillStyle='#f8c9a4';
    g.fillRect(cx-14,26,5,4); g.fillRect(cx+9,26,5,4);
    // head
    g.fillStyle='#f8c9a4';
    g.beginPath(); g.arc(cx,8,11,0,7); g.fill();
    // rosy cheeks
    g.fillStyle='rgba(255,120,120,0.6)';
    g.beginPath(); g.arc(cx-6,10,2.5,0,7); g.arc(cx+6,10,2.5,0,7); g.fill();
    // eyes (blue)
    g.fillStyle='#fff'; g.beginPath(); g.arc(cx-4,6,2.2,0,7); g.arc(cx+4,6,2.2,0,7); g.fill();
    g.fillStyle='#1e88e5'; g.beginPath(); g.arc(cx-4,6,1.2,0,7); g.arc(cx+4,6,1.2,0,7); g.fill();
    g.fillStyle='#000'; g.beginPath(); g.arc(cx-4,6,0.6,0,7); g.arc(cx+4,6,0.6,0,7); g.fill();
    // big smile
    g.strokeStyle='#c0392b'; g.lineWidth=1.6; g.beginPath(); g.arc(cx,10,3.5,0.15*Math.PI,0.85*Math.PI); g.stroke();
    // curly brown hair
    g.fillStyle='#5d3a1a';
    for(let i=-2;i<=2;i++){ g.beginPath(); g.arc(cx+i*4, 0, 3.2,0,7); g.fill(); }
    g.beginPath(); g.arc(cx-9,2,3,0,7); g.arc(cx+9,2,3,0,7); g.fill();
    // sword (held in front hand)
    const def=Inventory.weapon?ITEM_DEFS[Inventory.weapon]:null;
    if(def){
      g.save();
      g.translate(cx+12,22);
      let ang=-0.3;
      if(this.attacking>0){ ang = -1.3 + (1-this.attacking/14)*2.2; }
      g.rotate(ang);
      if(def.glow){ g.shadowColor=def.glow; g.shadowBlur=12; }
      g.fillStyle=def.blade; g.fillRect(-2,-26,4,26);
      g.beginPath(); g.moveTo(-2,-26); g.lineTo(0,-31); g.lineTo(2,-26); g.fill();
      g.shadowBlur=0;
      g.fillStyle='#5d4037'; g.fillRect(-6,0,12,3);
      g.fillStyle='#3e2723'; g.fillRect(-2,3,4,7);
      g.restore();
    }
    g.restore();
    g.globalAlpha=1;
  }
}
function drawStar(g,x,y,r,color){
  g.save(); g.translate(x,y); g.fillStyle=color; g.beginPath();
  for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5;
    g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    const a2=a+Math.PI/5; g.lineTo(Math.cos(a2)*r*0.45,Math.sin(a2)*r*0.45);
  }
  g.closePath(); g.fill(); g.restore();
}

// ---------- Enemy ----------
const ENEMY_STATS={
  slime:{hp:20,atk:8,w:34,h:26,speed:1.0,gold:[1,4]},
  goblin:{hp:30,atk:12,w:30,h:40,speed:1.4,gold:[5,12]},
  skeleton:{hp:50,atk:18,w:30,h:46,speed:1.6,gold:[10,20]},
  darkknight:{hp:120,atk:28,w:38,h:50,speed:1.2,gold:[25,50]},
  troll:{hp:250,atk:35,w:64,h:78,speed:1.0,gold:[60,120]},
  dragon:{hp:400,atk:45,w:90,h:70,speed:1.3,gold:[150,300]},
};
class Enemy {
  constructor(type,x,y){
    const s=ENEMY_STATS[type];
    this.type=type; this.x=x; this.y=y; this.w=s.w; this.h=s.h;
    this.maxHp=s.hp; this.hp=s.hp; this.atk=s.atk; this.speed=s.speed;
    this.vx=0; this.vy=0; this.dir=Math.random()<0.5?-1:1; this.onGround=false;
    this.dead=false; this.hitFlash=0; this.bounceP=Math.random()*7; this.attackCd=0;
    this.startX=x;
  }
  takeDamage(d){
    this.hp-=d; this.hitFlash=8;
    addFloater(this.x+this.w/2,this.y,'-'+d,'#ffeb3b');
    if(this.hp<=0)this.die();
  }
  die(){
    if(this.dead)return; this.dead=true;
    const s=ENEMY_STATS[this.type];
    const g=Math.floor(rand(s.gold[0],s.gold[1]));
    Game.score += this.maxHp;
    // drop gold orb + items
    Game.drops.push(new Drop(this.x+this.w/2,this.y, 'gold', g));
    for(const id of lootForEnemy(this.type)){
      Game.drops.push(new Drop(this.x+this.w/2+rand(-20,20),this.y, 'item', id));
    }
  }
  update(level,player){
    if(this.dead)return;
    // simple AI: patrol, chase if near
    const px=player.x+player.w/2, mx=this.x+this.w/2;
    const dist=Math.abs(px-mx);
    if(dist<260){ this.dir = px<mx?-1:1; this.vx=this.dir*this.speed; }
    else { this.vx=this.dir*this.speed*0.6; }
    this.vy+=GRAVITY; if(this.vy>16)this.vy=16;
    // horizontal
    this.x+=this.vx;
    let blockedH=false;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){ if(this.vx>0)this.x=p.x-this.w; else this.x=p.x+p.w; blockedH=true; } }
    if(blockedH && dist>=260) this.dir*=-1;
    // vertical
    this.y+=this.vy; this.onGround=false;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){
      if(this.vy>0){ this.y=p.y-this.h; this.vy=0; this.onGround=true; }
      else if(this.vy<0){ this.y=p.y+p.h; this.vy=0; }
    }}
    this.x=clamp(this.x,0,level.width-this.w);
    if(this.type==='slime' && this.onGround && Math.random()<0.04) this.vy=-7;
    this.bounceP+=0.12;
    if(this.hitFlash>0)this.hitFlash--;
    if(this.attackCd>0)this.attackCd--;
    // contact damage
    if(rectsOverlap(this,player) && this.attackCd===0){
      player.hurt(this.atk); this.attackCd=40;
    }
  }
  draw(g,cam){
    if(this.dead)return;
    const x=this.x-cam, y=this.y;
    g.save();
    if(this.hitFlash>0){ g.globalAlpha=0.7; }
    switch(this.type){
      case 'slime':{
        const sq=Math.sin(this.bounceP)*3;
        g.fillStyle=this.hitFlash>0?'#fff':'#43a047';
        g.beginPath();
        g.ellipse(x+this.w/2,y+this.h-(this.h/2-sq/2),this.w/2,(this.h-sq)/2,0,0,7); g.fill();
        g.fillStyle='#fff'; g.beginPath(); g.arc(x+this.w*0.35,y+this.h*0.55,3,0,7); g.arc(x+this.w*0.65,y+this.h*0.55,3,0,7); g.fill();
        g.fillStyle='#000'; g.beginPath(); g.arc(x+this.w*0.35,y+this.h*0.55,1.5,0,7); g.arc(x+this.w*0.65,y+this.h*0.55,1.5,0,7); g.fill();
        break;
      }
      case 'goblin':{
        g.fillStyle=this.hitFlash>0?'#fff':'#558b2f';
        g.fillRect(x+4,y+12,this.w-8,this.h-16);
        g.beginPath(); g.arc(x+this.w/2,y+10,9,0,7); g.fill();
        // ears
        g.beginPath(); g.moveTo(x+this.w/2-9,y+6); g.lineTo(x+this.w/2-15,y); g.lineTo(x+this.w/2-7,y+12); g.fill();
        g.beginPath(); g.moveTo(x+this.w/2+9,y+6); g.lineTo(x+this.w/2+15,y); g.lineTo(x+this.w/2+7,y+12); g.fill();
        g.fillStyle='#ffeb3b'; g.beginPath(); g.arc(x+this.w/2-3,y+9,1.6,0,7); g.arc(x+this.w/2+3,y+9,1.6,0,7); g.fill();
        g.strokeStyle='#000'; g.lineWidth=1; g.beginPath(); g.moveTo(x+this.w/2-3,y+13); g.lineTo(x+this.w/2+3,y+13); g.stroke();
        break;
      }
      case 'skeleton':{
        g.fillStyle=this.hitFlash>0?'#fff':'#eceff1';
        g.beginPath(); g.arc(x+this.w/2,y+10,9,0,7); g.fill();
        g.fillStyle='#000'; g.beginPath(); g.arc(x+this.w/2-3,y+9,2,0,7); g.arc(x+this.w/2+3,y+9,2,0,7); g.fill();
        g.fillStyle=this.hitFlash>0?'#fff':'#eceff1';
        g.fillRect(x+this.w/2-2,y+18,4,this.h-26);
        for(let i=0;i<4;i++){ g.fillRect(x+8,y+22+i*5,this.w-16,2); }
        g.fillRect(x+8,y+this.h-8,5,8); g.fillRect(x+this.w-13,y+this.h-8,5,8);
        break;
      }
      case 'darkknight':{
        g.fillStyle=this.hitFlash>0?'#fff':'#37474f';
        g.fillRect(x+4,y+14,this.w-8,this.h-18);
        g.beginPath(); g.arc(x+this.w/2,y+11,10,0,7); g.fill();
        // helmet visor
        g.fillStyle='#b71c1c'; g.fillRect(x+this.w/2-7,y+9,14,3);
        // shoulder spikes
        g.fillStyle=this.hitFlash>0?'#fff':'#263238';
        g.beginPath(); g.moveTo(x+4,y+16); g.lineTo(x-2,y+8); g.lineTo(x+10,y+16); g.fill();
        g.beginPath(); g.moveTo(x+this.w-4,y+16); g.lineTo(x+this.w+2,y+8); g.lineTo(x+this.w-10,y+16); g.fill();
        g.fillStyle='#90a4ae'; g.fillRect(x+this.w/2-2,y+18,4,this.h-24);
        break;
      }
      case 'troll':{
        g.fillStyle=this.hitFlash>0?'#fff':'#6d4c41';
        g.fillRect(x+8,y+24,this.w-16,this.h-28);
        g.beginPath(); g.arc(x+this.w/2,y+22,18,0,7); g.fill();
        g.fillStyle='#3e2723'; g.fillRect(x+10,y+this.h-8,14,8); g.fillRect(x+this.w-24,y+this.h-8,14,8);
        // angry eyes
        g.fillStyle='#ff1744'; g.beginPath(); g.arc(x+this.w/2-7,y+20,3,0,7); g.arc(x+this.w/2+7,y+20,3,0,7); g.fill();
        // tusks
        g.fillStyle='#fff'; g.beginPath(); g.moveTo(x+this.w/2-6,y+30); g.lineTo(x+this.w/2-9,y+38); g.lineTo(x+this.w/2-3,y+30); g.fill();
        g.beginPath(); g.moveTo(x+this.w/2+6,y+30); g.lineTo(x+this.w/2+9,y+38); g.lineTo(x+this.w/2+3,y+30); g.fill();
        // club
        g.fillStyle='#4e342e'; g.fillRect(x+this.w-6,y+10,6,40);
        break;
      }
      case 'dragon':{
        const f=Math.sin(this.bounceP)*8;
        g.fillStyle=this.hitFlash>0?'#fff':'#c62828';
        // wings
        g.beginPath(); g.moveTo(x+this.w*0.4,y+20); g.lineTo(x-10,y-10+f); g.lineTo(x+this.w*0.3,y+38); g.fill();
        g.beginPath(); g.moveTo(x+this.w*0.6,y+20); g.lineTo(x+this.w+10,y-10-f); g.lineTo(x+this.w*0.7,y+38); g.fill();
        // body
        g.fillStyle=this.hitFlash>0?'#fff':'#d32f2f';
        g.beginPath(); g.ellipse(x+this.w/2,y+this.h*0.6,this.w*0.35,this.h*0.4,0,0,7); g.fill();
        // head
        g.beginPath(); g.arc(x+this.w*0.78,y+this.h*0.35,16,0,7); g.fill();
        // snout
        g.fillRect(x+this.w*0.85,y+this.h*0.32,18,10);
        // eye
        g.fillStyle='#ffeb3b'; g.beginPath(); g.arc(x+this.w*0.8,y+this.h*0.3,3,0,7); g.fill();
        g.fillStyle='#000'; g.beginPath(); g.arc(x+this.w*0.8,y+this.h*0.3,1.5,0,7); g.fill();
        // horns
        g.fillStyle='#fff'; g.beginPath(); g.moveTo(x+this.w*0.7,y+this.h*0.2); g.lineTo(x+this.w*0.66,y); g.lineTo(x+this.w*0.76,y+this.h*0.2); g.fill();
        break;
      }
    }
    g.globalAlpha=1;
    g.restore();
    // hp bar
    if(this.hp<this.maxHp){
      const bw=this.w, bx=x, by=y-8;
      g.fillStyle='#000'; g.fillRect(bx,by,bw,4);
      g.fillStyle='#e53935'; g.fillRect(bx,by,bw*(this.hp/this.maxHp),4);
    }
    if(this.type==='dragon'||this.type==='troll'){
      g.fillStyle='#fff'; g.font='bold 10px Arial'; g.textAlign='center';
      g.fillText(this.type==='dragon'?'DRACHE':'TROLL', x+this.w/2, y-12);
    }
  }
}

// ---------- Drops ----------
class Drop {
  constructor(x,y,kind,payload){
    this.x=x-12; this.y=y; this.w=24; this.h=24; this.kind=kind; this.payload=payload;
    this.vy=-6; this.vx=rand(-2,2); this.landed=false; this.life=900; this.bob=Math.random()*7;
  }
  update(level,player){
    if(!this.landed){
      this.vy+=GRAVITY; this.x+=this.vx; this.y+=this.vy; this.vx*=0.95;
      for(const p of level.platforms){ if(rectsOverlap(this,p) && this.vy>0){ this.y=p.y-this.h; this.vy=0; this.landed=true; this.vx=0; } }
      if(this.y>H+200)this.life=0;
    } else { this.bob+=0.1; }
    this.life--;
    if(rectsOverlap(this,player)){
      if(this.kind==='gold'){ Inventory.gold+=this.payload; addMessage('+'+this.payload+' Gold'); }
      else { if(Inventory.add(this.payload)){ addMessage(ITEM_DEFS[this.payload].name+' erhalten!'); } else addMessage('Inventar voll!'); }
      this.life=0;
    }
  }
  draw(g,cam){
    const x=this.x-cam, y=this.y+(this.landed?Math.sin(this.bob)*2:0);
    if(this.kind==='gold'){
      g.fillStyle='#ffd700'; g.beginPath(); g.arc(x+12,y+12,8,0,7); g.fill();
      g.fillStyle='#ffecb3'; g.font='bold 10px Arial'; g.textAlign='center'; g.fillText('$',x+12,y+15);
    } else {
      const def=ITEM_DEFS[this.payload];
      g.save(); g.globalAlpha=0.9;
      g.strokeStyle=RARITY[def.rarity].color; g.lineWidth=2; g.strokeRect(x,y,24,24);
      g.fillStyle='rgba(0,0,0,0.4)'; g.fillRect(x,y,24,24);
      g.restore();
      drawItemIcon(g,this.payload,x,y,24);
    }
  }
}

// ---------- Levels ----------
const LEVELS=[
  {name:'Grüner Wald', sky:['#87ceeb','#bbe6a0'], ground:'#5a8f3a', accent:'#3c6b27'},
  {name:'Felsige Berge', sky:['#9ec5d6','#c9d3da'], ground:'#7d6f63', accent:'#5d5147'},
  {name:'Dunkle Höhle', sky:['#2a2438','#1a1622'], ground:'#3a3340', accent:'#221d2a'},
  {name:'Verfluchter Sumpf', sky:['#4a5c44','#2e3b2c'], ground:'#3f4a30', accent:'#2a331f'},
  {name:'Drachenhöhle BOSS', sky:['#5a1a1a','#2a0a0a'], ground:'#5a2a1a', accent:'#3a1810'},
  {name:'Eisschloss', sky:['#cfeaff','#a9d6f5'], ground:'#bcd8e8', accent:'#8fb8d0'},
  {name:'Lavafelder', sky:['#5a2010','#2a0f08'], ground:'#3a1810', accent:'#ff5722'},
  {name:'Himmelsinseln', sky:['#9bd6ff','#d6f0ff'], ground:'#b9e08f', accent:'#8fc46a'},
  {name:'Antike Ruinen', sky:['#c2b280','#8a7a52'], ground:'#a89868', accent:'#7a6a44'},
  {name:'Drachenfestung BOSS', sky:['#1a0a1a','#3a0a2a'], ground:'#2a1a2a', accent:'#9c27b0'},
];

class Level {
  constructor(idx){
    this.idx=idx;
    const def=LEVELS[idx];
    this.name=def.name; this.sky=def.sky; this.groundColor=def.ground; this.accent=def.accent;
    this.width = 3200 + idx*100;
    this.platforms=[]; this.enemySpawns=[]; this.decor=[];
    this.build();
    this.goal={x:this.width-120, y:H-160, w:70, h:110};
  }
  build(){
    const W2=this.width;
    // ground floor segments with occasional gaps
    let gx=0;
    while(gx<W2){
      let seg = rand(280,520);
      this.platforms.push({x:gx,y:H-40,w:seg,h:60,ground:true});
      gx+=seg;
      if(this.idx>=2 && gx<W2-400 && Math.random()<0.4){ gx+= rand(70,120); } // gap
    }
    // floating platforms
    const count = 14 + this.idx*2;
    for(let i=0;i<count;i++){
      const px = 250 + (i/(count)) * (W2-500) + rand(-60,60);
      const py = H-120 - rand(0,180);
      const pw = rand(90,180);
      this.platforms.push({x:px,y:py,w:pw,h:20});
    }
    // enemies
    const types = this.enemyTypesForLevel();
    const numEnemies = 6 + this.idx*2;
    for(let i=0;i<numEnemies;i++){
      const ex = 350 + (i/(numEnemies)) * (W2-600) + rand(-40,40);
      const t = pick(types.regular);
      this.enemySpawns.push({type:t, x:ex, y:H-120});
    }
    // bosses
    if(types.boss){
      this.enemySpawns.push({type:types.boss, x:W2-450, y:H-160});
    }
    // decor
    for(let i=0;i<25;i++){ this.decor.push({x:rand(0,W2), y:rand(20,200), r:rand(8,30), t:Math.random()}); }
  }
  enemyTypesForLevel(){
    switch(this.idx){
      case 0: return {regular:['goblin','slime','slime']};
      case 1: return {regular:['skeleton','goblin','skeleton']};
      case 2: return {regular:['darkknight','goblin','skeleton'], boss:'troll'};
      case 3: return {regular:['skeleton','darkknight','skeleton']};
      case 4: return {regular:['skeleton'], boss:'dragon'};
      case 5: return {regular:['darkknight','skeleton','goblin','slime'], boss:'troll'};
      case 6: return {regular:['darkknight','darkknight','skeleton']};
      case 7: return {regular:['dragon','darkknight','skeleton','goblin','slime']};
      case 8: return {regular:['darkknight','skeleton','darkknight'], boss:'troll'};
      case 9: return {regular:['darkknight','skeleton','goblin','slime'], boss:'dragon'};
    }
    return {regular:['slime']};
  }
  drawBg(g,cam){
    const grad=g.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,this.sky[0]); grad.addColorStop(1,this.sky[1]);
    g.fillStyle=grad; g.fillRect(0,0,W,H);
    // decor (clouds/rocks/stars) with parallax
    for(const d of this.decor){
      const dx=d.x-cam*0.4;
      if(dx<-50||dx>W+50)continue;
      if(this.idx===2||this.idx===9){ g.fillStyle='rgba(255,255,255,'+(0.3+d.t*0.5)+')'; g.fillRect(dx,d.y,2,2); }
      else if(this.idx===4||this.idx===6){ g.fillStyle='rgba(255,255,255,0.5)'; g.beginPath(); g.arc(dx,d.y,d.r,0,7); g.fill(); }
      else { g.fillStyle='rgba(255,255,255,0.55)'; g.beginPath(); g.arc(dx,d.y,d.r,0,7); g.arc(dx+d.r,d.y,d.r*0.8,0,7); g.arc(dx-d.r,d.y,d.r*0.7,0,7); g.fill(); }
    }
  }
  drawPlatforms(g,cam){
    for(const p of this.platforms){
      const px=p.x-cam; if(px>W||px+p.w<0)continue;
      g.fillStyle=this.groundColor; g.fillRect(px,p.y,p.w,p.h);
      g.fillStyle=this.accent; g.fillRect(px,p.y,p.w,5);
      if(p.ground){
        g.fillStyle='rgba(0,0,0,0.15)';
        for(let i=0;i<p.w;i+=24){ g.fillRect(px+i,p.y+8,2,p.h-8); }
      }
    }
    // goal portal
    const gx=this.goal.x-cam;
    const glow=0.5+Math.sin(Date.now()/300)*0.3;
    g.save();
    g.shadowColor='#ffd700'; g.shadowBlur=25;
    const gr=g.createLinearGradient(gx,this.goal.y,gx,this.goal.y+this.goal.h);
    gr.addColorStop(0,'rgba(255,230,120,'+glow+')'); gr.addColorStop(1,'rgba(255,160,40,'+glow+')');
    g.fillStyle=gr;
    g.beginPath(); g.moveTo(gx,this.goal.y+this.goal.h);
    g.lineTo(gx,this.goal.y+20); g.quadraticCurveTo(gx+this.goal.w/2,this.goal.y-15,gx+this.goal.w,this.goal.y+20);
    g.lineTo(gx+this.goal.w,this.goal.y+this.goal.h); g.fill();
    g.restore();
    g.fillStyle='#fff'; g.font='bold 12px Arial'; g.textAlign='center'; g.fillText('ZIEL',gx+this.goal.w/2,this.goal.y+this.goal.h/2);
  }
}

// ---------- Game ----------
const Game={
  state:'menu', // menu, levelstart, play, inventory, gameover, victory
  level:null, levelIndex:0,
  player:new Player(),
  enemies:[], drops:[],
  cam:0, levelStartTimer:0,
  hoverItem:-1, mouseX:0, mouseY:0,
  score:0,

  startGame(){
    Inventory.reset();
    this.player.reset();
    this.score=0;
    // starter potions
    Inventory.add('kleinerheil'); Inventory.add('kleinerheil');
    this.loadLevel(0);
  },
  loadLevel(idx){
    this.levelIndex=idx;
    this.level=new Level(idx);
    this.enemies=this.level.enemySpawns.map(s=>new Enemy(s.type,s.x,s.y));
    this.drops=[];
    this.player.x=80; this.player.y=300; this.player.vx=0; this.player.vy=0;
    this.player.hp=this.player.maxHp;
    this.cam=0;
    this.state='levelstart'; this.levelStartTimer=120;
    floaters=[]; messages=[];
  },
  nextLevel(){
    if(this.levelIndex>=9){ this.state='victory'; }
    else { this.loadLevel(this.levelIndex+1); }
  },
  update(){
    if(this.state==='levelstart'){
      this.levelStartTimer--; if(this.levelStartTimer<=0)this.state='play';
      return;
    }
    if(this.state!=='play')return;
    const p=this.player, lv=this.level;
    p.update(lv);
    for(const e of this.enemies)e.update(lv,p);
    this.enemies=this.enemies.filter(e=>!e.dead);
    for(const d of this.drops)d.update(lv,p);
    this.drops=this.drops.filter(d=>d.life>0);
    // camera lerp
    const target=clamp(p.x+p.w/2 - W/2, 0, lv.width-W);
    this.cam=lerp(this.cam,target,0.1);
    // floaters
    for(const f of floaters){ f.y+=f.vy; f.life--; }
    floaters=floaters.filter(f=>f.life>0);
    for(const m of messages)m.life--;
    messages=messages.filter(m=>m.life>0);
    // goal
    if(rectsOverlap(p,lv.goal)){ this.nextLevel(); }
    // death
    if(p.hp<=0){ this.state='gameover'; }
  },
  render(){
    if(this.state==='menu'){ this.drawMenu(); return; }
    if(this.state==='victory'){ this.drawVictory(); return; }
    const lv=this.level;
    lv.drawBg(ctx,this.cam);
    lv.drawPlatforms(ctx,this.cam);
    for(const d of this.drops)d.draw(ctx,this.cam);
    for(const e of this.enemies)e.draw(ctx,this.cam);
    this.player.draw(ctx,this.cam);
    // floaters
    ctx.textAlign='center'; ctx.font='bold 14px Arial';
    for(const f of floaters){ ctx.globalAlpha=clamp(f.life/30,0,1); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x-this.cam,f.y); }
    ctx.globalAlpha=1;
    this.drawHUD();
    // messages
    ctx.textAlign='center';
    for(let i=0;i<messages.length;i++){ ctx.globalAlpha=clamp(messages[i].life/60,0,1);
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W/2-130,80+i*26,260,22);
      ctx.fillStyle='#ffe082'; ctx.font='bold 13px Arial'; ctx.fillText(messages[i].text,W/2,96+i*26); }
    ctx.globalAlpha=1;

    if(this.state==='levelstart')this.drawLevelStart();
    if(this.state==='inventory')this.drawInventory();
    if(this.state==='gameover')this.drawGameOver();
  },
  drawHUD(){
    const p=this.player;
    // HP bar
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(12,12,204,22);
    ctx.fillStyle='#7f1212'; ctx.fillRect(14,14,200,18);
    ctx.fillStyle='#e53935'; ctx.fillRect(14,14,200*clamp(p.hp/p.maxHp,0,1),18);
    ctx.fillStyle='#fff'; ctx.font='bold 12px Arial'; ctx.textAlign='center';
    ctx.fillText(Math.ceil(p.hp)+' / '+p.maxHp,114,28);
    // stats
    ctx.textAlign='left'; ctx.font='bold 13px Arial';
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(12,40,204,52);
    ctx.fillStyle='#ff8a65'; ctx.fillText('ANG: '+p.atk + (p.buffAtk>0?' (+'+p.buffAtk+')':''),20,58);
    ctx.fillStyle='#90caf9'; ctx.fillText('VER: '+p.def,20,74);
    ctx.fillStyle='#ffd700'; ctx.fillText('Gold: '+Inventory.gold,110,58);
    ctx.fillStyle='#fff'; ctx.fillText('Punkte: '+this.score,110,74);
    // level name
    ctx.textAlign='right'; ctx.font='bold 14px Arial'; ctx.fillStyle='#fff';
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W-220,12,170,24);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.fillText('Lvl '+(this.levelIndex+1)+': '+this.level.name, W-135,29);
    // backpack icon
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W-44,10,32,32);
    ctx.fillStyle='#8d6e63'; ctx.fillRect(W-40,16,24,22);
    ctx.fillStyle='#6d4c41'; ctx.fillRect(W-40,16,24,7);
    ctx.fillStyle='#5d4037'; ctx.fillRect(W-32,12,8,8);
    ctx.fillStyle='#fff'; ctx.font='9px Arial'; ctx.fillText('I',W-28,52);
  },
  drawLevelStart(){
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 30px Arial';
    ctx.fillText('Level '+(this.levelIndex+1),W/2,H/2-20);
    ctx.font='bold 40px Arial'; ctx.fillStyle='#ffd700';
    ctx.fillText(this.level.name,W/2,H/2+25);
  },
  drawMenu(){
    const grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#1a237e'); grad.addColorStop(1,'#4a148c');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

    ctx.save(); ctx.translate(W/2-17, 90); ctx.scale(2.2,2.2);
    const tmp=new Player(); tmp.x=0; tmp.y=0; tmp.facing=1;
    Inventory.weapon='holzschwert';
    tmp.draw(ctx,-(0)+0); ctx.restore();
    ctx.textAlign='center';
    ctx.fillStyle='#ffd700'; ctx.font='bold 46px Arial'; ctx.fillText("Prinz Lucas'",W/2,250);
    ctx.fillStyle='#fff'; ctx.font='bold 40px Arial'; ctx.fillText('Abenteuer',W/2,295);
    // start button
    ctx.fillStyle='#43a047'; this._startBtn={x:W/2-110,y:330,w:220,h:48};
    roundRect(ctx,this._startBtn.x,this._startBtn.y,this._startBtn.w,this._startBtn.h,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 24px Arial'; ctx.fillText('Spiel starten',W/2,362);
    ctx.font='12px Arial'; ctx.fillStyle='#cfd8dc';
    ctx.fillText('Pfeile/WASD: Bewegen & Springen (Doppelsprung)  |  Z/X: Angriff',W/2,420);
    ctx.fillText('I/Tab: Inventar  |  1-5: Tränke benutzen  |  Enter/Leertaste: Bestätigen',W/2,440);
  },
  drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#e53935'; ctx.font='bold 48px Arial';
    ctx.fillText('Game Over',W/2,200);
    ctx.fillStyle='#fff'; ctx.font='18px Arial';
    ctx.fillText('Punkte: '+this.score,W/2,250);
    ctx.fillStyle='#1976d2'; this._restartBtn={x:W/2-100,y:290,w:200,h:46};
    roundRect(ctx,this._restartBtn.x,this._restartBtn.y,this._restartBtn.w,this._restartBtn.h,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 22px Arial'; ctx.fillText('Neu starten',W/2,320);
    ctx.font='12px Arial'; ctx.fillStyle='#bbb'; ctx.fillText('(Level wird mit gleicher Ausrüstung neu gestartet)',W/2,360);
  },
  drawVictory(){
    const grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#ffd700'); grad.addColorStop(1,'#ff6f00');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 50px Arial';
    ctx.fillText('SIEG!',W/2,160);
    ctx.font='bold 24px Arial';
    ctx.fillText('Prinz Lucas hat alle 10 Level gemeistert!',W/2,220);
    ctx.font='20px Arial'; ctx.fillText('Endpunktzahl: '+this.score,W/2,270);
    ctx.fillStyle='#1565c0'; this._restartBtn={x:W/2-100,y:310,w:200,h:46};
    roundRect(ctx,this._restartBtn.x,this._restartBtn.y,this._restartBtn.w,this._restartBtn.h,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 22px Arial'; ctx.fillText('Nochmal spielen',W/2,340);
  },
  drawInventory(){
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
    const panelX=140, panelY=50, panelW=520, panelH=400;
    ctx.fillStyle='#2c2438'; roundRect(ctx,panelX,panelY,panelW,panelH,12); ctx.fill();
    ctx.strokeStyle='#574a6b'; ctx.lineWidth=2; roundRect(ctx,panelX,panelY,panelW,panelH,12); ctx.stroke();
    ctx.textAlign='center'; ctx.fillStyle='#ffd700'; ctx.font='bold 22px Arial';
    ctx.fillText('Inventar',panelX+panelW/2,panelY+30);
    ctx.font='bold 14px Arial'; ctx.fillStyle='#ffd700'; ctx.textAlign='right';
    ctx.fillText('Gold: '+Inventory.gold,panelX+panelW-20,panelY+30);

    // equipment panel (left)
    this._invSlots=[];
    this._equipSlots={};
    const eqX=panelX+24, eqY=panelY+60;
    ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='13px Arial';
    ctx.fillText('Ausrüstung',eqX,eqY);
    // weapon slot
    const wsl={x:eqX,y:eqY+10,w:56,h:56};
    this._equipSlots.weapon=wsl;
    drawSlot(wsl,Inventory.weapon,'#90caf9');
    ctx.fillStyle='#aaa'; ctx.font='11px Arial'; ctx.fillText('Waffe',wsl.x+wsl.w+8,wsl.y+22);
    if(Inventory.weapon)ctx.fillText('+'+ITEM_DEFS[Inventory.weapon].atk+' ANG',wsl.x+wsl.w+8,wsl.y+38);
    // armor slot
    const asl={x:eqX,y:eqY+85,w:56,h:56};
    this._equipSlots.armor=asl;
    drawSlot(asl,Inventory.armor,'#a5d6a7');
    ctx.fillStyle='#aaa'; ctx.font='11px Arial'; ctx.fillText('Rüstung',asl.x+asl.w+8,asl.y+22);
    if(Inventory.armor)ctx.fillText('+'+ITEM_DEFS[Inventory.armor].def+' VER',asl.x+asl.w+8,asl.y+38);
    // hint
    ctx.fillStyle='#888'; ctx.font='10px Arial';
    ctx.fillText('Klick: ausrüsten/benutzen',eqX,eqY+200);
    ctx.fillText('Klick auf Ausrüstung: ablegen',eqX,eqY+214);

    // grid (right) 4 cols x 5 rows
    const gx0=panelX+200, gy0=panelY+70, cell=58, gap=6;
    let hover=-1;
    for(let r=0;r<5;r++)for(let cI=0;cI<4;cI++){
      const idx=r*4+cI;
      const sx=gx0+cI*(cell+gap), sy=gy0+r*(cell+gap);
      const slot={x:sx,y:sy,w:cell,h:cell,idx};
      this._invSlots.push(slot);
      const it=Inventory.items[idx];
      const def=it?ITEM_DEFS[it.id]:null;
      // bg
      const hovered = this.mouseX>=sx&&this.mouseX<=sx+cell&&this.mouseY>=sy&&this.mouseY<=sy+cell;
      ctx.fillStyle = hovered?'#473a5c':'#3a3148';
      roundRect(ctx,sx,sy,cell,cell,6); ctx.fill();
      if(def){
        ctx.strokeStyle=RARITY[def.rarity].color; ctx.lineWidth=2;
        roundRect(ctx,sx,sy,cell,cell,6); ctx.stroke();
        drawItemIcon(ctx,it.id,sx+5,sy+5,cell-10);
        if(it.count>1){ ctx.fillStyle='#fff'; ctx.font='bold 12px Arial'; ctx.textAlign='right'; ctx.fillText('x'+it.count,sx+cell-4,sy+cell-4); }
        if(hovered)hover=idx;
      }
    }
    // tooltip
    if(hover>=0){
      const it=Inventory.items[hover], def=ITEM_DEFS[it.id];
      const tx=clamp(this.mouseX+10,0,W-200), ty=this.mouseY+10;
      ctx.fillStyle='rgba(0,0,0,0.92)'; roundRect(ctx,tx,ty,190,70,6); ctx.fill();
      ctx.strokeStyle=RARITY[def.rarity].color; roundRect(ctx,tx,ty,190,70,6); ctx.stroke();
      ctx.textAlign='left'; ctx.fillStyle=RARITY[def.rarity].color; ctx.font='bold 13px Arial';
      ctx.fillText(def.name,tx+10,ty+20);
      ctx.fillStyle='#bbb'; ctx.font='11px Arial';
      ctx.fillText(RARITY[def.rarity].name,tx+10,ty+36);
      let stat='';
      if(def.type==='weapon')stat='+'+def.atk+' Angriff';
      else if(def.type==='armor')stat='+'+def.def+' Verteidigung';
      else if(def.heal)stat='Heilt '+def.heal+' HP';
      else if(def.buffAtk)stat='+'+def.buffAtk+' ANG (10s)';
      ctx.fillStyle='#fff'; ctx.fillText(stat,tx+10,ty+54);
    }
    ctx.textAlign='center'; ctx.fillStyle='#aaa'; ctx.font='11px Arial';
    ctx.fillText('I oder Tab zum Schließen',panelX+panelW/2,panelY+panelH-12);
  },
  clickInventory(mx,my){
    // equip slots: unequip
    const es=this._equipSlots;
    if(es.weapon && inRect(mx,my,es.weapon)){
      if(Inventory.weapon){ if(Inventory.items.length<Inventory.maxSlots){ Inventory.add(Inventory.weapon); Inventory.weapon=null; addMessage('Waffe abgelegt'); } }
      return;
    }
    if(es.armor && inRect(mx,my,es.armor)){
      if(Inventory.armor){ if(Inventory.items.length<Inventory.maxSlots){ Inventory.add(Inventory.armor); Inventory.armor=null; addMessage('Rüstung abgelegt'); } }
      return;
    }
    for(const slot of this._invSlots){
      if(inRect(mx,my,slot)){
        const it=Inventory.items[slot.idx]; if(!it)return;
        const def=ITEM_DEFS[it.id];
        if(def.type==='weapon'){ const old=Inventory.weapon; Inventory.weapon=it.id; Inventory.remove(slot.idx); if(old)Inventory.add(old); addMessage(def.name+' ausgerüstet'); }
        else if(def.type==='armor'){ const old=Inventory.armor; Inventory.armor=it.id; Inventory.remove(slot.idx); if(old)Inventory.add(old); addMessage(def.name+' ausgerüstet'); }
        else if(def.type==='potion'){ this.usePotion(slot.idx); }
        return;
      }
    }
  },
  usePotion(idx){
    const it=Inventory.items[idx]; if(!it)return;
    const def=ITEM_DEFS[it.id]; if(def.type!=='potion')return;
    if(def.heal){ this.player.hp=clamp(this.player.hp+def.heal,0,this.player.maxHp); addFloater(this.player.x+15,this.player.y,'+'+def.heal,'#69f0ae'); addMessage(def.name+' benutzt'); }
    else if(def.buffAtk){ this.player.buffAtk=def.buffAtk; this.player.buffTimer=def.buffTime; addMessage('Stärketrank aktiv!'); }
    it.count--; if(it.count<=0)Inventory.remove(idx);
  },
  // quick-use potion by inventory order (number keys)
  quickPotion(n){
    const potionIdxs=[];
    Inventory.items.forEach((it,i)=>{ if(ITEM_DEFS[it.id].type==='potion')potionIdxs.push(i); });
    if(potionIdxs[n-1]!==undefined)this.usePotion(potionIdxs[n-1]);
  },
};

function inRect(mx,my,r){ return mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h; }
function drawSlot(s,id,color){
  ctx.fillStyle='#3a3148'; roundRect(ctx,s.x,s.y,s.w,s.h,6); ctx.fill();
  ctx.strokeStyle=id?RARITY[ITEM_DEFS[id].rarity].color:color; ctx.lineWidth=2; roundRect(ctx,s.x,s.y,s.w,s.h,6); ctx.stroke();
  if(id)drawItemIcon(ctx,id,s.x+5,s.y+5,s.w-10);
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// ---------- Input ----------
const keys={left:false,right:false};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','tab'].includes(k))e.preventDefault();
  if(k==='arrowleft'||k==='a')keys.left=true;
  if(k==='arrowright'||k==='d')keys.right=true;
  if(Game.state==='play'){
    if(k==='arrowup'||k==='w'||k===' ')Game.player.jump();
    if(k==='z'||k==='x')Game.player.attack();
    if(k>='1'&&k<='5')Game.quickPotion(parseInt(k));
  }
  if(k==='i'||k==='tab'){
    if(Game.state==='play')Game.state='inventory';
    else if(Game.state==='inventory')Game.state='play';
  }
  if((k==='enter'||k===' ')){
    if(Game.state==='menu')Game.startGame();
    else if(Game.state==='gameover'||Game.state==='victory')Game.startGame();
  }
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.left=false;
  if(k==='arrowright'||k==='d')keys.right=false;
});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  Game.mouseX=(e.clientX-r.left)*(W/r.width); Game.mouseY=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  if(Game.state==='menu'){ if(Game._startBtn&&inRect(mx,my,Game._startBtn))Game.startGame(); }
  else if(Game.state==='gameover'||Game.state==='victory'){ if(Game._restartBtn&&inRect(mx,my,Game._restartBtn))Game.startGame(); }
  else if(Game.state==='inventory'){ Game.clickInventory(mx,my); }
  else if(Game.state==='play'){ if(mx>W-44&&mx<W-12&&my>10&&my<42)Game.state='inventory'; }
});

// ---------- Loop ----------
function loop(){ Game.update(); Game.render(); requestAnimationFrame(loop); }
loop();
</script>
