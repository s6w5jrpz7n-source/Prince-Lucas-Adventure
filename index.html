function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rectsOverlap(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}
function rand(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function lootForEnemy(type){
  switch(type){
    case 'slime': return Math.random()<0.7?['kleinerheil']:[];
    case 'goblin': { let out=[]; if(Math.random()<0.4) out.push(pick(['holzschwert','lederruestung','kleinerheil'])); return out; }

  },
  now(){ return this.ctx?this.ctx.currentTime:0; },
  tone(freq,type,duration,volume,startTime){
    if(!this.ctx)return;
    const t=startTime!==undefined?startTime:this.now();
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(volume,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+duration+0.02);
    return o;
  },
  slide(f1,f2,type,duration,volume){
    if(!this.ctx)return;
    const t=this.now();
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(f2,t+duration);
    g.gain.setValueAtTime(volume,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+duration+0.02);
  },
  noise(duration,volume,filterFreq){
    if(!this.ctx)return;
    const t=this.now();
    const len=Math.floor(this.ctx.sampleRate*duration);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(volume,t); g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq||1000;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  },

        bas:[N.A3,N.A3,N._,N.A3,N.E3,N.E3,N._,N.E3, N.D3,N.D3,N._,N.D3,N.E3,N._,N.E3,N._,
             N.F3,N._,N.F3,N._,N.A3,N.A3,N._,N.A3, N.E3,N._,N.E3,N._,N.A3,N._,N._,N._],
        cho:[[N.A3,N.C4,N.E4],[N.D4,N.F4,N.A4],[N.E4,N.G4,N.B4],[N.F4,N.A4,N.C5]] },
    ];

    // Clamp to available themes
    const th=themes[Math.min(levelIdx,themes.length-1)];
    const beat=60/th.bpm;
    let i=0;
    const chordsPerBar=th.cho.length;
    const step=()=>{
      if(!this.musicOn)return;
      const t0=this.now();
      const mi=i%th.mel.length;
      const bi=i%th.bas.length;
      const mn=th.mel[mi], bn=th.bas[bi];
      // melody
      if(mn) this.tone(mn,th.mt,beat*0.88,(levelIdx===4||levelIdx===9)?0.055:0.048,t0);
      // bass
      if(bn) this.tone(bn,th.bt,beat*1.7,0.055,t0);
      // chord pads every 4 steps
      if(i%4===0){
        const chord=th.cho[Math.floor(i/4)%chordsPerBar];
        chord.forEach((n,ci)=>{ if(n)this.tone(n,'sine',beat*3.8,0.022,t0+ci*0.008); });
      }
      // percussion: kick+snare
      if(i%4===0) this.noise(0.06,0.07,220);
      if(i%4===2) this.noise(0.04,0.04,900);
      i++;
      this.musicTimer=setTimeout(step,beat*1000);
    };
    step();
  },
  stopMusic(){ this.musicOn=false; if(this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer=null; } },
};

// ---------- Inventory ----------
const Inventory = {
  items:[], gold:0, weapon:null, armor:null, maxSlots:20,
  reset(){ this.items=[]; this.gold=0; this.weapon='holzschwert'; this.armor=null; },
  add(id){
    const def=ITEM_DEFS[id]; if(!def)return false;
    if(def.type==='potion'){ let s=this.items.find(it=>it.id===id); if(s){s.count++;return true;} }
    if(this.items.length>=this.maxSlots)return false;
    this.items.push({id,count:1}); return true;
  },
  remove(idx){ this.items.splice(idx,1); },
  totalAtk(){ return (this.weapon?ITEM_DEFS[this.weapon].atk:0); },
  totalDef(){ return (this.armor?ITEM_DEFS[this.armor].def:0); },
};

// ---------- Drawing item icons ----------
function drawItemIcon(g,id,x,y,size){
  const def=ITEM_DEFS[id]; if(!def)return;
  g.save(); g.translate(x,y); const s=size;
  if(def.type==='weapon'){
    g.save(); g.translate(s*0.5,s*0.5); g.rotate(-Math.PI/4);
    if(def.glow){ g.shadowColor=def.glow; g.shadowBlur=10; }
    g.fillStyle=def.blade; g.fillRect(-s*0.06,-s*0.42,s*0.12,s*0.55);
    g.beginPath(); g.moveTo(-s*0.06,-s*0.42); g.lineTo(0,-s*0.5); g.lineTo(s*0.06,-s*0.42); g.fill();
    g.shadowBlur=0;
    g.fillStyle='#5d4037'; g.fillRect(-s*0.18,s*0.1,s*0.36,s*0.07);
    g.fillStyle='#3e2723'; g.fillRect(-s*0.05,s*0.17,s*0.1,s*0.18);
    g.fillStyle='#ffca28'; g.beginPath(); g.arc(0,s*0.36,s*0.05,0,7); g.fill();
    g.restore();
  } else if(def.type==='armor'){
    g.fillStyle=def.color;
    g.beginPath(); g.moveTo(s*0.2,s*0.2); g.lineTo(s*0.35,s*0.15); g.lineTo(s*0.5,s*0.25);
    g.lineTo(s*0.65,s*0.15); g.lineTo(s*0.8,s*0.2);
    g.lineTo(s*0.72,s*0.8); g.lineTo(s*0.28,s*0.8); g.closePath(); g.fill();
    g.strokeStyle='rgba(0,0,0,0.3)'; g.lineWidth=2; g.stroke();
    g.fillStyle='rgba(255,255,255,0.25)'; g.fillRect(s*0.46,s*0.25,s*0.08,s*0.5);
  } else if(def.type==='potion'){
    g.fillStyle='rgba(255,255,255,0.25)'; g.fillRect(s*0.42,s*0.12,s*0.16,s*0.12);
    g.fillStyle=def.color;
    g.beginPath(); g.moveTo(s*0.38,s*0.28); g.lineTo(s*0.62,s*0.28);
    g.quadraticCurveTo(s*0.78,s*0.5,s*0.72,s*0.7);
    g.quadraticCurveTo(s*0.6,s*0.85,s*0.5,s*0.85);
    g.quadraticCurveTo(s*0.4,s*0.85,s*0.28,s*0.7);
    g.quadraticCurveTo(s*0.22,s*0.5,s*0.38,s*0.28); g.fill();
    g.fillStyle='rgba(255,255,255,0.4)'; g.beginPath(); g.arc(s*0.43,s*0.55,s*0.05,0,7); g.fill();
    g.fillStyle='#6d4c41'; g.fillRect(s*0.42,s*0.08,s*0.16,s*0.07);
  }
  g.restore();
}

// ---------- Floating texts & messages ----------
let floaters=[];
function addFloater(x,y,text,color){ floaters.push({x,y,text,color:color||'#fff',life:60,vy:-1.2}); }
let messages=[];
function addMessage(text){ messages.push({text,life:180}); if(messages.length>4)messages.shift(); }

// ---------- Player ----------
class Player {
  constructor(){ this.reset(); }
  reset(){
    this.x=120; this.y=420; this.w=44; this.h=60;
    this.vx=0; this.vy=0; this.onGround=false; this.facing=1;
    this.jumps=0; this.maxHp=100; this.hp=100;
    this.attacking=0; this.attackCd=0; this.invuln=0;
    this.buffAtk=0; this.buffTimer=0; this.walkFrame=0; this.walkTick=0; this.moving=false;
  }
  get atk(){ return 5 + Inventory.totalAtk() + this.buffAtk; }
  get def(){ return Inventory.totalDef(); }
  update(level){
    const sp=5.0;
    if(keys.left){ this.vx=-sp; this.facing=-1; }
    else if(keys.right){ this.vx=sp; this.facing=1; }
    else this.vx*=0.7;
    this.vy+=GRAVITY; if(this.vy>17)this.vy=17;
    this.x+=this.vx;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){ if(this.vx>0)this.x=p.x-this.w; else if(this.vx<0)this.x=p.x+p.w; this.vx=0; } }
    this.y+=this.vy; this.onGround=false;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){
      if(this.vy>0){ this.y=p.y-this.h; this.vy=0; this.onGround=true; this.jumps=0; }
      else if(this.vy<0){ this.y=p.y+p.h; this.vy=0; }
    }}
    this.x=clamp(this.x,0,level.width-this.w);
    if(this.y>H+250){ this.hp=0; }
    this.moving = Math.abs(this.vx)>0.5 && this.onGround;
    if(this.moving){ this.walkTick++; if(this.walkTick>=8){ this.walkTick=0; this.walkFrame=(this.walkFrame+1)%4; } }
    else { this.walkFrame=0; this.walkTick=0; }
    if(this.attacking>0)this.attacking--;
    if(this.attackCd>0)this.attackCd--;
    if(this.invuln>0)this.invuln--;
    if(this.buffTimer>0){ this.buffTimer--; if(this.buffTimer===0)this.buffAtk=0; }
  }
  jump(){ if(this.jumps<2){ this.vy=-13.5; this.jumps++; this.onGround=false; Sound.jump(); } }
  attack(){
    if(this.attackCd>0)return;
    this.attacking=14; this.attackCd=24; Sound.attack();
    const reach=60;
    const hb={x:this.facing>0?this.x+this.w:this.x-reach, y:this.y-6, w:reach, h:this.h+10};
    for(const e of Game.enemies){ if(e.dead)continue;
      if(rectsOverlap(hb,e)){
        const dmg=this.atk + Math.floor(rand(-2,3));
        e.takeDamage(dmg); Sound.hitEnemy();
        e.vx += this.facing*4; e.vy=-3;
      }
    }
  }
  hurt(dmg){
    if(this.invuln>0)return;
    const real=Math.max(1, dmg - Math.floor(this.def*0.6));
    this.hp-=real; this.invuln=50; Sound.takeDamage();
    addFloater(this.x+this.w/2,this.y,'-'+real,'#ff5252');
    if(this.hp<=0)this.hp=0;
  }
  draw(g,cam){
    const x=this.x-cam, y=this.y;
    if(this.invuln>0 && Math.floor(this.invuln/4)%2===0) g.globalAlpha=0.5;
    g.save(); g.translate(x+this.w/2,y);
    if(this.facing<0)g.scale(-1,1);
    g.translate(-this.w/2,0);
    const cx=this.w/2;
    // walk-frame offsets matching the 4-pose sprite sheet
    // 0=idle(sword raised), 1=walk step R, 2=mid, 3=walk step L
    let rLeg=0,lLeg=0,rArm=0,lArm=0,bodyBob=0;
    switch(this.walkFrame){
      case 0: rLeg=0;  lLeg=0;  rArm=0;  lArm=0;  bodyBob=0;  break;
      case 1: rLeg=-7; lLeg=5;  rArm=5;  lArm=-6; bodyBob=-1; break;
      case 2: rLeg=0;  lLeg=0;  rArm=0;  lArm=0;  bodyBob=1;  break;
      case 3: rLeg=5;  lLeg=-7; rArm=-6; lArm=5;  bodyBob=-1; break;
    }
    // Attack pose: wide stance like bottom-right sprite
    if(this.attacking>0){ rLeg=4; lLeg=-4; rArm=-4; lArm=8; bodyBob=2; }

    // ── SHADOW ──
    g.fillStyle='rgba(0,0,0,0.18)';
    g.beginPath(); g.ellipse(cx,62,14,4,0,0,Math.PI*2); g.fill();

    // ── LEFT LEG (back) ──
    g.fillStyle='#c62828';
    g.fillRect(cx-12, 38+bodyBob+lLeg, 12, 18-lLeg);
    // left shoe + cuff
    g.fillStyle='#37474f'; g.fillRect(cx-14, 54+bodyBob+lLeg, 14, 8);
    g.fillStyle='#fb8c00'; g.fillRect(cx-14, 52+bodyBob+lLeg, 14, 4); // orange cuff
    g.fillStyle='#f8c9a4'; g.fillRect(cx-13, 51+bodyBob+lLeg, 12, 3); // light trim above cuff
    // yellow star on left leg
    drawStar(g, cx-6, 46+bodyBob+lLeg, 4.5, '#ffd600');

    // ── RIGHT LEG (front) ──
    g.fillStyle='#d32f2f';
    g.fillRect(cx+0, 38+bodyBob+rLeg, 12, 18-rLeg);
    // right shoe + cuff
    g.fillStyle='#37474f'; g.fillRect(cx-1, 54+bodyBob+rLeg, 14, 8);
    g.fillStyle='#fb8c00'; g.fillRect(cx-1, 52+bodyBob+rLeg, 14, 4);
    g.fillStyle='#f8c9a4'; g.fillRect(cx, 51+bodyBob+rLeg, 12, 3);
    // blue cross on right leg
    g.fillStyle='#42a5f5';
    g.fillRect(cx+4, 43+bodyBob+rLeg, 4, 8);
    g.fillRect(cx+2, 45+bodyBob+rLeg, 8, 4);

    // ── BODY – blue shirt ──
    const shirtColor = Inventory.armor ? ITEM_DEFS[Inventory.armor].color : '#1565c0';
    g.fillStyle=shirtColor;
    g.fillRect(cx-14, 17+bodyBob, 28, 23);
    // shirt collar/cuffs in slightly lighter blue
    g.fillStyle=Inventory.armor?shirtColor:'#1976d2';
    g.fillRect(cx-14, 17+bodyBob, 28, 4);  // collar band
    g.fillRect(cx-14, 36+bodyBob, 28, 4);  // bottom band

    // fire-truck pattern on shirt (3 small trucks)
    if(!Inventory.armor){
      // truck 1
      g.fillStyle='#e53935'; g.fillRect(cx-11,22+bodyBob,8,5);
      g.fillStyle='#ff7043'; g.fillRect(cx-11,20+bodyBob,6,4);
      g.fillStyle='#ffeb3b'; g.fillRect(cx-10,21+bodyBob,2,2);
      g.fillStyle='#212121'; g.beginPath(); g.arc(cx-9,27+bodyBob,1.5,0,7); g.arc(cx-5,27+bodyBob,1.5,0,7); g.fill();
      // truck 2
      g.fillStyle='#e53935'; g.fillRect(cx+3,22+bodyBob,8,5);
      g.fillStyle='#ff7043'; g.fillRect(cx+3,20+bodyBob,6,4);
      g.fillStyle='#ffeb3b'; g.fillRect(cx+4,21+bodyBob,2,2);
      g.fillStyle='#212121'; g.beginPath(); g.arc(cx+5,27+bodyBob,1.5,0,7); g.arc(cx+9,27+bodyBob,1.5,0,7); g.fill();
      // truck 3 (smaller, bottom center)
      g.fillStyle='#e53935'; g.fillRect(cx-4,31+bodyBob,8,4);
      g.fillStyle='#ff7043'; g.fillRect(cx-4,29+bodyBob,5,3);
      g.fillStyle='#212121'; g.beginPath(); g.arc(cx-2,35+bodyBob,1.2,0,7); g.arc(cx+2,35+bodyBob,1.2,0,7); g.fill();
    } else {
      g.fillStyle='rgba(255,255,255,0.18)'; g.fillRect(cx-4,20+bodyBob,8,18);
    }

    // ── ARMS ──
    g.fillStyle=shirtColor;
    g.fillRect(cx-19, 19+bodyBob+lArm, 7, 16);  // left arm
    g.fillRect(cx+12, 19+bodyBob+rArm, 7, 16);  // right arm
    // sleeve cuffs
    g.fillStyle=Inventory.armor?shirtColor:'#1976d2';
    g.fillRect(cx-19, 32+bodyBob+lArm, 7, 3);
    g.fillRect(cx+12, 32+bodyBob+rArm, 7, 3);
    // hands (peach)
    g.fillStyle='#f8c9a4';
    g.fillRect(cx-19, 34+bodyBob+lArm, 7, 5);
    g.fillRect(cx+12, 34+bodyBob+rArm, 7, 5);

    // ── HEAD (big, round, toddler proportions) ──
    g.fillStyle='#f8c9a4';
    g.beginPath(); g.arc(cx, 8+bodyBob, 15, 0, Math.PI*2); g.fill();
    // ear left
    g.fillStyle='#f0b898'; g.beginPath(); g.arc(cx-14, 10+bodyBob, 4, 0, Math.PI*2); g.fill();
    // ear right
    g.beginPath(); g.arc(cx+14, 10+bodyBob, 4, 0, Math.PI*2); g.fill();

    // ── FACE ──
    // rosy cheeks
    g.fillStyle='rgba(240,100,100,0.5)';
    g.beginPath(); g.arc(cx-8, 13+bodyBob, 4, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+8, 13+bodyBob, 4, 0, Math.PI*2); g.fill();
    // whites of eyes
    g.fillStyle='#fff';
    g.beginPath(); g.ellipse(cx-5, 7+bodyBob, 3.5, 4, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx+5, 7+bodyBob, 3.5, 4, 0, 0, Math.PI*2); g.fill();
    // iris (blue)
    g.fillStyle='#1e88e5';
    g.beginPath(); g.arc(cx-5, 8+bodyBob, 2.2, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+5, 8+bodyBob, 2.2, 0, Math.PI*2); g.fill();
    // pupil
    g.fillStyle='#000';
    g.beginPath(); g.arc(cx-5, 8+bodyBob, 1.1, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+5, 8+bodyBob, 1.1, 0, Math.PI*2); g.fill();
    // eye shine
    g.fillStyle='rgba(255,255,255,0.8)';
    g.beginPath(); g.arc(cx-4, 7+bodyBob, 0.8, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+6, 7+bodyBob, 0.8, 0, Math.PI*2); g.fill();
    // big open smile with teeth (matching sprite)
    g.fillStyle='#e53935';
    g.beginPath(); g.arc(cx, 13+bodyBob, 5.5, 0, Math.PI); g.fill();
    g.fillStyle='#fff';
    g.fillRect(cx-5, 13+bodyBob, 10, 3);
    g.strokeStyle='rgba(200,50,50,0.5)'; g.lineWidth=0.8;
    for(let t=-1;t<=1;t++){ g.beginPath(); g.moveTo(cx+t*2.5,13+bodyBob); g.lineTo(cx+t*2.5,16+bodyBob); g.stroke(); }
    // nose dot
    g.fillStyle='rgba(200,100,80,0.6)'; g.beginPath(); g.arc(cx, 11+bodyBob, 1.4, 0, Math.PI*2); g.fill();

    // ── HAIR (golden, voluminous, fluffy curls – matching sprite) ──
    // Dark base
    g.fillStyle='#b8860b';
    g.beginPath(); g.arc(cx, -4+bodyBob, 16, Math.PI*0.9, Math.PI*2.1); g.fill();
    g.beginPath(); g.arc(cx-14, 3+bodyBob, 5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+14, 3+bodyBob, 5, 0, Math.PI*2); g.fill();
    // Golden mid layer
    g.fillStyle='#c8922a';
    // big fluffy clumps
    const clumps=[{x:cx-12,y:bodyBob-1,r:5.5},{x:cx-7,y:bodyBob-7,r:6},{x:cx,y:bodyBob-9,r:6.5},
                  {x:cx+7,y:bodyBob-7,r:6},{x:cx+12,y:bodyBob-1,r:5.5}];
    for(const c of clumps){ g.beginPath(); g.arc(c.x,c.y,c.r,0,Math.PI*2); g.fill(); }
    // Highlight / bright tips
    g.fillStyle='#e8c040';
    const hiClumps=[{x:cx-8,y:bodyBob-8,r:3.5},{x:cx,y:bodyBob-11,r:4},{x:cx+8,y:bodyBob-8,r:3.5}];
    for(const c of hiClumps){ g.beginPath(); g.arc(c.x,c.y,c.r,0,Math.PI*2); g.fill(); }
    // Very bright highlights on tips
    g.fillStyle='#f5d060';
    g.beginPath(); g.arc(cx, bodyBob-12, 2.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx-7, bodyBob-9, 2, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+7, bodyBob-9, 2, 0, Math.PI*2); g.fill();

    // ── SWORD ──
    const def=Inventory.weapon?ITEM_DEFS[Inventory.weapon]:null;
    if(def){
      g.save();
      if(this.attacking>0){
        // Attack pose: sword thrust forward horizontally like bottom-right sprite
        const prog=(1-this.attacking/14);
        g.translate(cx+14+prog*8, 26+bodyBob);
        g.rotate(-0.2 + prog*0.5);
      } else {
        // Idle: sword held up and slightly tilted like top-left sprite
        g.translate(cx+15, 25+bodyBob);
        g.rotate(-0.35);
      }
      if(def.glow){ g.shadowColor=def.glow; g.shadowBlur=16; }
      // Blade (wooden texture or metal gleam)
      g.fillStyle=def.blade;
      g.fillRect(-3,-36,6,36);
      // Blade tip
      g.beginPath(); g.moveTo(-3,-36); g.lineTo(0,-43); g.lineTo(3,-36); g.closePath(); g.fill();
      // Blade edge highlight
      g.fillStyle='rgba(255,255,255,0.35)'; g.fillRect(-1,-36,2,36);
      g.shadowBlur=0;
      // Guard
      g.fillStyle='#5d4037'; g.fillRect(-9,0,18,5);
      g.fillStyle='#4e342e'; g.fillRect(-9,0,4,5); g.fillRect(5,0,4,5); // darker ends
      // Handle
      g.fillStyle='#3e2723'; g.fillRect(-3,5,6,10);
      // Wrap lines on handle
      g.strokeStyle='#6d4c41'; g.lineWidth=1.2;
      for(let hw=0;hw<3;hw++){ g.beginPath(); g.moveTo(-3,6+hw*3); g.lineTo(3,6+hw*3); g.stroke(); }
      // Pommel
      g.fillStyle='#5d4037'; g.beginPath(); g.arc(0,16,3.5,0,Math.PI*2); g.fill();
      g.restore();
    }
    g.restore();
    g.globalAlpha=1;
  }
}
function drawStar(g,x,y,r,color){
  g.save(); g.translate(x,y); g.fillStyle=color; g.beginPath();
  for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5;
    g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    const a2=a+Math.PI/5; g.lineTo(Math.cos(a2)*r*0.45,Math.sin(a2)*r*0.45);
  }
  g.closePath(); g.fill(); g.restore();
}

// ---------- Enemy ----------
const ENEMY_STATS={
  slime:{hp:20,atk:8,w:44,h:34,speed:1.2,gold:[1,4]},
  goblin:{hp:30,atk:12,w:40,h:52,speed:1.7,gold:[5,12]},
  skeleton:{hp:50,atk:18,w:38,h:58,speed:1.9,gold:[10,20]},
  darkknight:{hp:120,atk:28,w:50,h:64,speed:1.4,gold:[25,50]},
  troll:{hp:250,atk:35,w:84,h:100,speed:1.2,gold:[60,120]},
  dragon:{hp:400,atk:45,w:120,h:90,speed:1.5,gold:[150,300]},
};
class Enemy {
  constructor(type,x,y){
    const s=ENEMY_STATS[type];
    this.type=type; this.x=x; this.y=y; this.w=s.w; this.h=s.h;
    this.maxHp=s.hp; this.hp=s.hp; this.atk=s.atk; this.speed=s.speed;
    this.vx=0; this.vy=0; this.dir=Math.random()<0.5?-1:1; this.onGround=false;
    this.dead=false; this.hitFlash=0; this.bounceP=Math.random()*7; this.attackCd=0;
    this.startX=x; this.firing=0;
    this.isBoss=(type==='troll'||type==='dragon');
  }
  takeDamage(d){
    this.hp-=d; this.hitFlash=8;
    addFloater(this.x+this.w/2,this.y,'-'+d,'#ffeb3b');
    if(this.hp<=0)this.die();
  }
  die(){
    if(this.dead)return; this.dead=true;
    const s=ENEMY_STATS[this.type];
    const g=Math.floor(rand(s.gold[0],s.gold[1]));
    Game.score += this.maxHp;
    Game.drops.push(new Drop(this.x+this.w/2,this.y, 'gold', g));
    for(const id of lootForEnemy(this.type)){
      Game.drops.push(new Drop(this.x+this.w/2+rand(-20,20),this.y, 'item', id));
    }
  }
  update(level,player){
    if(this.dead)return;
    const px=player.x+player.w/2, mx=this.x+this.w/2;
    const dist=Math.abs(px-mx);
    if(dist<340){ this.dir = px<mx?-1:1; this.vx=this.dir*this.speed; }
    else { this.vx=this.dir*this.speed*0.6; }
    // Pit detection: look ahead for ground, turn around at edges (non-flying enemies)
    if(this.onGround && this.type!=='dragon'){
      const lookX = this.vx>0 ? this.x+this.w+6 : this.x-6;
      let groundAhead=false;
      for(const p of level.platforms){
        if(lookX>=p.x && lookX<=p.x+p.w && p.y>=this.y+this.h-8 && p.y<=this.y+this.h+55){ groundAhead=true; break; }
      }
      if(!groundAhead){ this.dir*=-1; this.vx*=-1; }
    }
    this.vy+=GRAVITY; if(this.vy>16)this.vy=16;
    this.x+=this.vx;
    let blockedH=false;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){ if(this.vx>0)this.x=p.x-this.w; else this.x=p.x+p.w; blockedH=true; } }
    if(blockedH && dist>=340) this.dir*=-1;
    this.y+=this.vy; this.onGround=false;
    for(const p of level.platforms){ if(rectsOverlap(this,p)){
      if(this.vy>0){ this.y=p.y-this.h; this.vy=0; this.onGround=true; }
      else if(this.vy<0){ this.y=p.y+p.h; this.vy=0; }
    }}
    this.x=clamp(this.x,0,level.width-this.w);
    if(this.type==='slime' && this.onGround && Math.random()<0.04) this.vy=-7;
    this.bounceP+=0.12;
    if(this.hitFlash>0)this.hitFlash--;
    if(this.attackCd>0)this.attackCd--;
    if(this.firing>0)this.firing--;
    if(rectsOverlap(this,player) && this.attackCd===0){
      player.hurt(this.atk); this.attackCd=40;
      if(this.type==='dragon')this.firing=20;
      if(this.isBoss)Sound.bossRoar();
    }
  }
  draw(g,cam){
    if(this.dead)return;
    const x=this.x-cam, y=this.y;
    g.save();
    if(this.hitFlash>0){ g.globalAlpha=0.7; }
    const W2=this.w, H2=this.h;
    switch(this.type){
      case 'slime':{
        const sq=Math.sin(this.bounceP)*4;
        g.fillStyle=this.hitFlash>0?'#fff':'#43a047';
        g.beginPath(); g.ellipse(x+W2/2,y+H2-(H2/2-sq/2),W2/2,(H2-sq)/2,0,0,7); g.fill();
        // shine highlight
        g.fillStyle='rgba(255,255,255,0.4)'; g.beginPath(); g.ellipse(x+W2*0.35,y+H2*0.4,W2*0.13,H2*0.1,0,0,7); g.fill();
        // drip
        g.fillStyle=this.hitFlash>0?'#fff':'#388e3c';
        const drip=Math.abs(Math.sin(this.bounceP*0.7))*5;
        g.beginPath(); g.arc(x+W2*0.5,y+H2-2+drip,3,0,7); g.fill();
        // googly eyes
        g.fillStyle='#fff'; g.beginPath(); g.arc(x+W2*0.35,y+H2*0.55,5,0,7); g.arc(x+W2*0.65,y+H2*0.55,5,0,7); g.fill();
        g.fillStyle='#000'; g.beginPath(); g.arc(x+W2*0.36,y+H2*0.58,2.4,0,7); g.arc(x+W2*0.66,y+H2*0.58,2.4,0,7); g.fill();
        break;
      }
      case 'goblin':{
        g.fillStyle=this.hitFlash>0?'#fff':'#558b2f';
        g.fillRect(x+6,y+18,W2-12,H2-22);
        // green skin texture
        g.fillStyle='rgba(0,0,0,0.12)'; g.fillRect(x+8,y+22,4,4); g.fillRect(x+W2-14,y+28,4,4);
        g.fillStyle=this.hitFlash>0?'#fff':'#558b2f';
        g.beginPath(); g.arc(x+W2/2,y+14,12,0,7); g.fill();
        // ears
        g.beginPath(); g.moveTo(x+W2/2-12,y+8); g.lineTo(x+W2/2-20,y); g.lineTo(x+W2/2-9,y+16); g.fill();
        g.beginPath(); g.moveTo(x+W2/2+12,y+8); g.lineTo(x+W2/2+20,y); g.lineTo(x+W2/2+9,y+16); g.fill();
        // pointed hat
        g.fillStyle='#6d4c41'; g.beginPath(); g.moveTo(x+W2/2-12,y+6); g.lineTo(x+W2/2,y-12); g.lineTo(x+W2/2+12,y+6); g.fill();
        // eyes
        g.fillStyle='#ffeb3b'; g.beginPath(); g.arc(x+W2/2-4,y+13,2.2,0,7); g.arc(x+W2/2+4,y+13,2.2,0,7); g.fill();
        g.strokeStyle='#000'; g.lineWidth=1.2; g.beginPath(); g.moveTo(x+W2/2-4,y+18); g.lineTo(x+W2/2+4,y+18); g.stroke();
        // belt + buckle
        g.fillStyle='#3e2723'; g.fillRect(x+6,y+H2-14,W2-12,4);
        g.fillStyle='#ffca28'; g.fillRect(x+W2/2-3,y+H2-15,6,6);
        // tiny dagger
        g.fillStyle='#cfd8dc'; g.fillRect(x+W2-4,y+24,3,12);
        g.fillStyle='#5d4037'; g.fillRect(x+W2-5,y+34,5,3);
        break;
      }
      case 'skeleton':{
        g.fillStyle=this.hitFlash>0?'#fff':'#eceff1';
        g.beginPath(); g.arc(x+W2/2,y+13,12,0,7); g.fill();
        // skull cracks
        g.strokeStyle='#90a4ae'; g.lineWidth=1; g.beginPath(); g.moveTo(x+W2/2-2,y+4); g.lineTo(x+W2/2+1,y+11); g.stroke();
        g.fillStyle='#000'; g.beginPath(); g.arc(x+W2/2-4,y+12,2.6,0,7); g.arc(x+W2/2+4,y+12,2.6,0,7); g.fill();
        // jaw teeth
        g.fillStyle='#fff'; g.fillRect(x+W2/2-5,y+19,10,3);
        g.strokeStyle='#90a4ae'; for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+W2/2-3+i*3,y+19); g.lineTo(x+W2/2-3+i*3,y+22); g.stroke(); }
        // spine
        g.fillStyle=this.hitFlash>0?'#fff':'#eceff1';
        g.fillRect(x+W2/2-2,y+24,4,H2-32);
        // ribs
        for(let i=0;i<4;i++){ g.fillRect(x+8,y+28+i*6,W2-16,2); }
        // dangling arm bones
        g.fillRect(x+4,y+26,4,18); g.fillRect(x+W2-8,y+26,4,14);
        // legs
        g.fillRect(x+9,y+H2-10,5,10); g.fillRect(x+W2-14,y+H2-10,5,10);
        break;
      }
      case 'darkknight':{
        g.fillStyle=this.hitFlash>0?'#fff':'#37474f';
        g.fillRect(x+6,y+18,W2-12,H2-24);
        g.beginPath(); g.arc(x+W2/2,y+14,13,0,7); g.fill();
        // detailed helmet T-visor
        g.fillStyle='#212121'; g.fillRect(x+W2/2-2,y+8,4,12); g.fillRect(x+W2/2-8,y+10,16,3);
        // glowing red eyes
        g.fillStyle='#ff1744'; g.beginPath(); g.arc(x+W2/2-4,y+11,1.6,0,7); g.arc(x+W2/2+4,y+11,1.6,0,7); g.fill();
        // shoulder spikes
        g.fillStyle=this.hitFlash>0?'#fff':'#263238';
        g.beginPath(); g.moveTo(x+6,y+20); g.lineTo(x-2,y+10); g.lineTo(x+14,y+20); g.fill();
        g.beginPath(); g.moveTo(x+W2-6,y+20); g.lineTo(x+W2+2,y+10); g.lineTo(x+W2-14,y+20); g.fill();
        // shield left arm
        g.fillStyle='#546e7a'; g.fillRect(x-4,y+24,8,22);
        g.fillStyle='#ffca28'; g.beginPath(); g.arc(x,y+35,3,0,7); g.fill();
        // sword right arm
        g.fillStyle='#cfd8dc'; g.fillRect(x+W2-2,y+18,4,30);
        g.fillStyle='#5d4037'; g.fillRect(x+W2-4,y+46,8,4);
        // leg armor
        g.fillStyle='#90a4ae'; g.fillRect(x+10,y+H2-12,8,12); g.fillRect(x+W2-18,y+H2-12,8,12);
        break;
      }
      case 'troll':{
        g.fillStyle=this.hitFlash>0?'#fff':'#6d4c41';
        g.fillRect(x+10,y+34,W2-20,H2-38);
        g.beginPath(); g.arc(x+W2/2,y+30,24,0,7); g.fill();
        // mossy hair on top
        g.fillStyle='#558b2f'; for(let i=-2;i<=2;i++){ g.beginPath(); g.arc(x+W2/2+i*8,y+8,6,0,7); g.fill(); }
        // warts
        g.fillStyle=this.hitFlash>0?'#fff':'#5d4037';
        g.beginPath(); g.arc(x+W2*0.3,y+34,3,0,7); g.arc(x+W2*0.7,y+40,3.5,0,7); g.arc(x+W2*0.45,y+24,2.5,0,7); g.fill();
        // angry eyes
        g.fillStyle='#ff1744'; g.beginPath(); g.arc(x+W2/2-9,y+28,4,0,7); g.arc(x+W2/2+9,y+28,4,0,7); g.fill();
        // tusks
        g.fillStyle='#fff'; g.beginPath(); g.moveTo(x+W2/2-8,y+40); g.lineTo(x+W2/2-12,y+50); g.lineTo(x+W2/2-4,y+40); g.fill();
        g.beginPath(); g.moveTo(x+W2/2+8,y+40); g.lineTo(x+W2/2+12,y+50); g.lineTo(x+W2/2+4,y+40); g.fill();
        // massive hands
        g.fillStyle=this.hitFlash>0?'#fff':'#5d4037';
        g.beginPath(); g.arc(x+8,y+H2-20,9,0,7); g.arc(x+W2-8,y+H2-20,9,0,7); g.fill();
        // torn loincloth
        g.fillStyle='#8d6e63'; g.fillRect(x+14,y+H2-22,W2-28,12);
        // spiked club
        g.fillStyle='#4e342e'; g.fillRect(x+W2-8,y+8,8,54);
        g.fillStyle='#757575'; g.beginPath(); g.arc(x+W2-4,y+10,7,0,7); g.fill();
        g.fillStyle='#bdbdbd'; for(let i=0;i<4;i++){ const a=i*Math.PI/2; g.beginPath(); g.moveTo(x+W2-4,y+10); g.lineTo(x+W2-4+Math.cos(a)*10,y+10+Math.sin(a)*10); g.lineTo(x+W2-4+Math.cos(a+0.4)*7,y+10+Math.sin(a+0.4)*7); g.fill(); }
        break;
      }
      case 'dragon':{
        const f=Math.sin(this.bounceP)*10;
        // wings with bone structure
        g.fillStyle=this.hitFlash>0?'#fff':'#c62828';
        g.beginPath(); g.moveTo(x+W2*0.4,y+25); g.lineTo(x-16,y-14+f); g.lineTo(x+W2*0.28,y+48); g.fill();
        g.beginPath(); g.moveTo(x+W2*0.6,y+25); g.lineTo(x+W2+16,y-14-f); g.lineTo(x+W2*0.72,y+48); g.fill();
        g.strokeStyle='#7f0000'; g.lineWidth=1.5;
        g.beginPath(); g.moveTo(x+W2*0.4,y+25); g.lineTo(x-10,y-8+f); g.stroke();
        g.beginPath(); g.moveTo(x+W2*0.6,y+25); g.lineTo(x+W2+10,y-8-f); g.stroke();
        // body
        g.fillStyle=this.hitFlash>0?'#fff':'#d32f2f';
        g.beginPath(); g.ellipse(x+W2/2,y+H2*0.6,W2*0.35,H2*0.4,0,0,7); g.fill();
        // scales pattern
        g.fillStyle='rgba(0,0,0,0.15)';
        for(let r=0;r<3;r++)for(let cI=0;cI<4;cI++){ g.beginPath(); g.arc(x+W2*0.35+cI*10,y+H2*0.45+r*10,4,Math.PI,0); g.fill(); }
        // tail
        g.fillStyle=this.hitFlash>0?'#fff':'#d32f2f';
        g.beginPath(); g.moveTo(x+W2*0.2,y+H2*0.6); g.lineTo(x-20,y+H2*0.9); g.lineTo(x+W2*0.25,y+H2*0.75); g.fill();
        // head
        g.beginPath(); g.arc(x+W2*0.78,y+H2*0.35,20,0,7); g.fill();
        g.fillRect(x+W2*0.85,y+H2*0.32,24,13);
        // eye
        g.fillStyle='#ffeb3b'; g.beginPath(); g.arc(x+W2*0.8,y+H2*0.3,4,0,7); g.fill();
        g.fillStyle='#000'; g.beginPath(); g.arc(x+W2*0.8,y+H2*0.3,2,0,7); g.fill();
        // horns
        g.fillStyle='#fff'; g.beginPath(); g.moveTo(x+W2*0.7,y+H2*0.2); g.lineTo(x+W2*0.66,y); g.lineTo(x+W2*0.78,y+H2*0.2); g.fill();
        // fire breath
        if(this.firing>0){
          for(let i=0;i<8;i++){ const fx=x+W2*1.05+i*8+rand(-3,3), fy=y+H2*0.4+rand(-6,6);
            g.fillStyle=i%2?'rgba(255,152,0,0.8)':'rgba(255,87,34,0.8)';
            g.beginPath(); g.arc(fx,fy,rand(3,7),0,7); g.fill(); }
        }
        break;
      }
    }
    g.globalAlpha=1;
    g.restore();
    if(this.hp<this.maxHp && !this.isBoss){
      const bw=this.w, bx=x, by=y-10;
      g.fillStyle='#000'; g.fillRect(bx,by,bw,5);
      g.fillStyle='#e53935'; g.fillRect(bx,by,bw*(this.hp/this.maxHp),5);
    }
    if(this.isBoss){
      g.fillStyle='#fff'; g.font='bold 13px Arial'; g.textAlign='center';
      g.fillText(this.type==='dragon'?'DRACHE':'TROLL', x+this.w/2, y-16);
    }
  }
}

// ---------- Drops ----------
class Drop {
  constructor(x,y,kind,payload){
    this.x=x-14; this.y=y; this.w=28; this.h=28; this.kind=kind; this.payload=payload;
    this.vy=-6; this.vx=rand(-2,2); this.landed=false; this.life=900; this.bob=Math.random()*7;
  }
  update(level,player){
    if(!this.landed){
      this.vy+=GRAVITY; this.x+=this.vx; this.y+=this.vy; this.vx*=0.95;
      for(const p of level.platforms){ if(rectsOverlap(this,p) && this.vy>0){ this.y=p.y-this.h; this.vy=0; this.landed=true; this.vx=0; } }
      if(this.y>H+250)this.life=0;
    } else { this.bob+=0.1; }
    this.life--;
    if(rectsOverlap(this,player)){
      if(this.kind==='gold'){ Inventory.gold+=this.payload; addMessage('+'+this.payload+' Gold'); Sound.collectGold(); }
      else { if(Inventory.add(this.payload)){ addMessage(ITEM_DEFS[this.payload].name+' erhalten!'); Sound.collectItem(); } else addMessage('Inventar voll!'); }
      this.life=0;
    }
  }
  draw(g,cam){
    const x=this.x-cam, y=this.y+(this.landed?Math.sin(this.bob)*2:0);
    if(this.kind==='gold'){
      g.fillStyle='#ffd700'; g.beginPath(); g.arc(x+14,y+14,9,0,7); g.fill();
      g.fillStyle='#ffecb3'; g.font='bold 12px Arial'; g.textAlign='center'; g.fillText('$',x+14,y+18);
    } else {
      const def=ITEM_DEFS[this.payload];
      g.save(); g.globalAlpha=0.9;
      g.strokeStyle=RARITY[def.rarity].color; g.lineWidth=2; g.strokeRect(x,y,28,28);
      g.fillStyle='rgba(0,0,0,0.4)'; g.fillRect(x,y,28,28);
      g.restore();
      drawItemIcon(g,this.payload,x,y,28);
    }
  }
}

// ---------- Shop NPC ----------
class ShopNPC {
  constructor(x,y){ this.x=x; this.y=y; this.w=40; this.h=56; this.near=false; }
  update(player){
    this.near = Math.abs((player.x+player.w/2)-(this.x+this.w/2))<80;
  }
  draw(g,cam){
    const x=this.x-cam, y=this.y;
    if(x>W+60||x+this.w<-60)return;
    // body robe
    g.fillStyle='#5d4037'; g.fillRect(x+6,y+22,this.w-12,this.h-22);
    // head
    g.fillStyle='#f0c89a'; g.beginPath(); g.arc(x+this.w/2,y+16,11,0,7); g.fill();
    // white beard
    g.fillStyle='#eceff1'; g.beginPath(); g.moveTo(x+this.w/2-8,y+18); g.lineTo(x+this.w/2,y+34); g.lineTo(x+this.w/2+8,y+18); g.fill();
    // merchant hat
    g.fillStyle='#3949ab'; g.beginPath(); g.moveTo(x+this.w/2-12,y+8); g.lineTo(x+this.w/2,y-8); g.lineTo(x+this.w/2+12,y+8); g.fill();
    g.fillStyle='#ffca28'; g.fillRect(x+this.w/2-12,y+7,24,3);
    // eyes
    g.fillStyle='#000'; g.beginPath(); g.arc(x+this.w/2-4,y+15,1.4,0,7); g.arc(x+this.w/2+4,y+15,1.4,0,7); g.fill();
    // sign
    g.fillStyle='#8d6e63'; g.fillRect(x+this.w-2,y+6,3,30);
    g.fillStyle='#d7ccc8'; g.fillRect(x+this.w+1,y+2,26,18);
    g.fillStyle='#3e2723'; g.font='bold 11px Arial'; g.textAlign='center'; g.fillText('🛒',x+this.w+14,y+15);
    if(this.near){
      g.fillStyle='rgba(0,0,0,0.7)'; roundRect(g,x-8,y-30,56,20,5); g.fill();
      g.fillStyle='#ffe082'; g.font='bold 12px Arial'; g.textAlign='center';
      g.fillText('S = Shop',x+this.w/2,y-16);
    }
  }
}

// ---------- Levels ----------
const LEVELS=[
  {name:'Grüner Wald', sky:['#87ceeb','#bbe6a0'], ground:'#5a8f3a', accent:'#3c6b27'},
  {name:'Felsige Berge', sky:['#9ec5d6','#c9d3da'], ground:'#7d6f63', accent:'#5d5147'},
  {name:'Dunkle Höhle', sky:['#2a2438','#1a1622'], ground:'#3a3340', accent:'#221d2a'},
  {name:'Verfluchter Sumpf', sky:['#4a5c44','#2e3b2c'], ground:'#3f4a30', accent:'#2a331f'},
  {name:'Drachenhöhle BOSS', sky:['#5a1a1a','#2a0a0a'], ground:'#5a2a1a', accent:'#3a1810'},
  {name:'Eisschloss', sky:['#cfeaff','#a9d6f5'], ground:'#bcd8e8', accent:'#8fb8d0'},
  {name:'Lavafelder', sky:['#5a2010','#2a0f08'], ground:'#3a1810', accent:'#ff5722'},
  {name:'Himmelsinseln', sky:['#9bd6ff','#d6f0ff'], ground:'#b9e08f', accent:'#8fc46a'},
  {name:'Antike Ruinen', sky:['#c2b280','#8a7a52'], ground:'#a89868', accent:'#7a6a44'},
  {name:'Drachenfestung BOSS', sky:['#1a0a1a','#3a0a2a'], ground:'#2a1a2a', accent:'#9c27b0'},
];

class Level {
  constructor(idx){
    this.idx=idx;
    const def=LEVELS[idx];
    this.name=def.name; this.sky=def.sky; this.groundColor=def.ground; this.accent=def.accent;
    this.width = 5000 + idx*160;
    this.platforms=[]; this.enemySpawns=[]; this.decor=[];
    this.build();
    this.goal={x:this.width-180, y:H-220, w:100, h:150};
    this.npc=new ShopNPC(200, H-40-56);
  }
  build(){
    const W2=this.width;
    let gx=0;
    while(gx<W2){
      let seg = rand(450,830);
      this.platforms.push({x:gx,y:H-40,w:seg,h:80,ground:true});
      gx+=seg;
      if(this.idx>=2 && gx<W2-640 && Math.random()<0.4){ gx+= rand(110,190); }
    }
    const count = 14 + this.idx*2;
    for(let i=0;i<count;i++){
      const px = 400 + (i/(count)) * (W2-800) + rand(-96,96);
      const py = H-180 - rand(0,290);
      const pw = rand(150,290);
      this.platforms.push({x:px,y:py,w:pw,h:28});
    }
    const types = this.enemyTypesForLevel();
    const numEnemies = 6 + this.idx*2;
    for(let i=0;i<numEnemies;i++){
      const ex = 560 + (i/(numEnemies)) * (W2-960) + rand(-64,64);
      const t = pick(types.regular);
      this.enemySpawns.push({type:t, x:ex, y:H-180});
    }
    if(types.boss){
      this.enemySpawns.push({type:types.boss, x:W2-720, y:H-260});
    }
    // Apples hidden on floating platforms
    this.apples=[];
    for(const p of this.platforms){
      if(!p.ground && p.w>80 && Math.random()<0.40){
        const ax=p.x+20+Math.random()*(p.w-40);
        this.apples.push({x:ax, y:p.y-18, w:20, h:20, collected:false, bob:Math.random()*Math.PI*2});
      }
    }
    for(let i=0;i<35;i++){ this.decor.push({x:rand(0,W2), y:rand(30,300), r:rand(12,45), t:Math.random()}); }
  }
  enemyTypesForLevel(){
    switch(this.idx){
      case 0: return {regular:['goblin','slime','slime']};
      case 1: return {regular:['skeleton','goblin','skeleton']};
      case 2: return {regular:['darkknight','goblin','skeleton'], boss:'troll'};
      case 3: return {regular:['skeleton','darkknight','skeleton']};
      case 4: return {regular:['skeleton'], boss:'dragon'};
      case 5: return {regular:['darkknight','skeleton','goblin','slime'], boss:'troll'};
      case 6: return {regular:['darkknight','darkknight','skeleton']};
      case 7: return {regular:['dragon','darkknight','skeleton','goblin','slime']};
      case 8: return {regular:['darkknight','skeleton','darkknight'], boss:'troll'};
      case 9: return {regular:['darkknight','skeleton','goblin','slime'], boss:'dragon'};
    }
    return {regular:['slime']};
  }
  drawBg(g,cam){
    const grad=g.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,this.sky[0]); grad.addColorStop(1,this.sky[1]);
    g.fillStyle=grad; g.fillRect(0,0,W,H);
    for(const d of this.decor){
      const dx=d.x-cam*0.4;
      if(dx<-80||dx>W+80)continue;
      if(this.idx===2||this.idx===9){ g.fillStyle='rgba(255,255,255,'+(0.3+d.t*0.5)+')'; g.fillRect(dx,d.y,3,3); }
      else if(this.idx===4||this.idx===6){ g.fillStyle='rgba(255,255,255,0.5)'; g.beginPath(); g.arc(dx,d.y,d.r,0,7); g.fill(); }
      else { g.fillStyle='rgba(255,255,255,0.55)'; g.beginPath(); g.arc(dx,d.y,d.r,0,7); g.arc(dx+d.r,d.y,d.r*0.8,0,7); g.arc(dx-d.r,d.y,d.r*0.7,0,7); g.fill(); }
    }
  }
  drawPlatforms(g,cam){
    for(const p of this.platforms){
      const px=p.x-cam; if(px>W||px+p.w<0)continue;
      g.fillStyle=this.groundColor; g.fillRect(px,p.y,p.w,p.h);
      g.fillStyle=this.accent; g.fillRect(px,p.y,p.w,7);
      if(p.ground){
        g.fillStyle='rgba(0,0,0,0.15)';
        for(let i=0;i<p.w;i+=36){ g.fillRect(px+i,p.y+12,3,p.h-12); }
      }
    }
    const gx=this.goal.x-cam;
    const glow=0.5+Math.sin(Date.now()/300)*0.3;
    g.save();
    g.shadowColor='#ffd700'; g.shadowBlur=30;
    const gr=g.createLinearGradient(gx,this.goal.y,gx,this.goal.y+this.goal.h);
    gr.addColorStop(0,'rgba(255,230,120,'+glow+')'); gr.addColorStop(1,'rgba(255,160,40,'+glow+')');
    g.fillStyle=gr;
    g.beginPath(); g.moveTo(gx,this.goal.y+this.goal.h);
    g.lineTo(gx,this.goal.y+28); g.quadraticCurveTo(gx+this.goal.w/2,this.goal.y-20,gx+this.goal.w,this.goal.y+28);
    g.lineTo(gx+this.goal.w,this.goal.y+this.goal.h); g.fill();
    g.restore();
    g.fillStyle='#fff'; g.font='bold 16px Arial'; g.textAlign='center'; g.fillText('ZIEL',gx+this.goal.w/2,this.goal.y+this.goal.h/2);
  }
  drawApples(g,cam){
    for(const a of this.apples){
      if(a.collected)continue;
      a.bob+=0.055;
      const ax=a.x-cam, ay=a.y+Math.sin(a.bob)*4;
      if(ax<-30||ax>W+30)continue;
      // Body
      g.fillStyle='#e53935'; g.beginPath(); g.arc(ax,ay,11,0,Math.PI*2); g.fill();
      // Cheek shine
      g.fillStyle='rgba(255,255,255,0.45)'; g.beginPath(); g.arc(ax-4,ay-4,4,0,Math.PI*2); g.fill();
      // Dark bottom shadow
      g.fillStyle='rgba(0,0,0,0.15)'; g.beginPath(); g.arc(ax,ay+3,8,0,Math.PI*2); g.fill();
      // Stem
      g.strokeStyle='#4e342e'; g.lineWidth=2.5; g.beginPath(); g.moveTo(ax,ay-11); g.quadraticCurveTo(ax+5,ay-18,ax+4,ay-20); g.stroke();
      // Leaf
      g.fillStyle='#388e3c'; g.beginPath(); g.ellipse(ax+7,ay-18,6,3,-0.6,0,Math.PI*2); g.fill();
      g.strokeStyle='#1b5e20'; g.lineWidth=1; g.beginPath(); g.moveTo(ax+4,ay-16); g.lineTo(ax+10,ay-20); g.stroke();
    }
  }
}

// ---------- Game ----------
const Game={
  state:'menu',
  level:null, levelIndex:0,
  player:new Player(),
  enemies:[], drops:[],
  cam:0, levelStartTimer:0,
  hoverItem:-1, mouseX:0, mouseY:0,
  score:0, lastScore:0,
  _shopFromLevel:false, shopTab:'buy', shopScroll:0, completeTimer:0,

  startGame(){
    Inventory.reset();
    this.player.reset();
    this.score=0;
    Inventory.add('kleinerheil'); Inventory.add('kleinerheil');
    this.loadLevel(0);
  },
  loadLevel(idx){
    this.levelIndex=idx;
    this.level=new Level(idx);
    this.enemies=this.level.enemySpawns.map(s=>new Enemy(s.type,s.x,s.y));
    this.drops=[];
    this.player.x=120; this.player.y=420; this.player.vx=0; this.player.vy=0;
    this.player.hp=this.player.maxHp;
    this.cam=0;
    this.state='levelstart'; this.levelStartTimer=120;
    floaters=[]; messages=[];
    Sound.startMusic(idx);
  },
  completeLevel(){
    this.lastScore=this.score;
    Sound.levelComplete();
    this.state='levelcomplete'; this.completeTimer=120;
  },
  nextLevel(){
    if(this.levelIndex>=9){ this.state='victory'; Sound.stopMusic(); }
    else { this.loadLevel(this.levelIndex+1); }
  },
  getBoss(){ return this.enemies.find(e=>e.isBoss && !e.dead); },
  update(){
    if(this.state==='levelstart'){
      this.levelStartTimer--; if(this.levelStartTimer<=0)this.state='play';
      return;
    }
    if(this.state==='levelcomplete'){
      this.completeTimer--;
      if(this.completeTimer<=0){ this._shopFromLevel=true; this.shopTab='buy'; this.shopScroll=0; this.state='shop'; }
      return;
    }
    if(this.state!=='play')return;
    const p=this.player, lv=this.level;
    p.update(lv);
    lv.npc.update(p);
    for(const e of this.enemies)e.update(lv,p);
    this.enemies=this.enemies.filter(e=>!e.dead);
    for(const d of this.drops)d.update(lv,p);
    this.drops=this.drops.filter(d=>d.life>0);
    // Apple collection
    for(const a of lv.apples){
      if(a.collected)continue;
      if(rectsOverlap(p,{x:a.x-11,y:a.y-11,w:22,h:22})){
        a.collected=true; this.score+=50;
        addFloater(a.x,a.y-10,'+50 🍎','#ff6b6b'); Sound.collectItem();
        addMessage('Apfel gefunden! +50 Punkte');
      }
    }
    const target=clamp(p.x+p.w/2 - W/2, 0, lv.width-W);
    this.cam=lerp(this.cam,target,0.1);
    for(const f of floaters){ f.y+=f.vy; f.life--; }
    floaters=floaters.filter(f=>f.life>0);
    for(const m of messages)m.life--;
    messages=messages.filter(m=>m.life>0);
    if(rectsOverlap(p,lv.goal)){ this.completeLevel(); }
    if(p.hp<=0){ this.state='gameover'; Sound.stopMusic(); }
  },
  render(){
    if(this.state==='menu'){ this.drawMenu(); return; }
    if(this.state==='victory'){ this.drawVictory(); return; }
    if(this.state==='shop'){ this.drawShop(); return; }
    const lv=this.level;
    lv.drawBg(ctx,this.cam);
    lv.drawPlatforms(ctx,this.cam);
    lv.drawApples(ctx,this.cam);
    lv.npc.draw(ctx,this.cam);
    for(const d of this.drops)d.draw(ctx,this.cam);
    for(const e of this.enemies)e.draw(ctx,this.cam);
    this.player.draw(ctx,this.cam);
    ctx.textAlign='center'; ctx.font='bold 18px Arial';
    for(const f of floaters){ ctx.globalAlpha=clamp(f.life/30,0,1); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x-this.cam,f.y); }
    ctx.globalAlpha=1;
    this.drawHUD();
    ctx.textAlign='center';
    for(let i=0;i<messages.length;i++){ ctx.globalAlpha=clamp(messages[i].life/60,0,1);
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W/2-170,120+i*32,340,28);
      ctx.fillStyle='#ffe082'; ctx.font='bold 16px Arial'; ctx.fillText(messages[i].text,W/2,140+i*32); }
    ctx.globalAlpha=1;

    if(this.state==='levelstart')this.drawLevelStart();
    if(this.state==='levelcomplete')this.drawLevelComplete();
    if(this.state==='inventory')this.drawInventory();
    if(this.state==='gameover')this.drawGameOver();

  // ---------- SHOP ----------
  drawShop(){
    ctx.fillStyle='rgba(10,5,20,0.95)'; ctx.fillRect(0,0,W,H);
    const px=120, py=50, pw=W-240, ph=H-100;
    ctx.fillStyle='#1f1830'; roundRect(ctx,px,py,pw,ph,16); ctx.fill();
    ctx.strokeStyle='#6a1b9a'; ctx.lineWidth=3; roundRect(ctx,px,py,pw,ph,16); ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle='#ffd700'; ctx.font='bold 34px Arial';
    ctx.fillText('🛒 Händler',px+30,py+50);
    ctx.textAlign='right'; ctx.fillStyle='#ffd700'; ctx.font='bold 24px Arial';
    ctx.fillText('Gold: '+Inventory.gold,px+pw-30,py+50);
    // tabs
    this._shopTabs={};
    const tabY=py+70, tabW=200, tabH=44;
    const buyT={x:px+30,y:tabY,w:tabW,h:tabH};
    const sellT={x:px+30+tabW+20,y:tabY,w:tabW,h:tabH};
    this._shopTabs.buy=buyT; this._shopTabs.sell=sellT;
    ctx.fillStyle=this.shopTab==='buy'?'#43a047':'#37474f'; roundRect(ctx,buyT.x,buyT.y,buyT.w,buyT.h,8); ctx.fill();
    ctx.fillStyle=this.shopTab==='sell'?'#e65100':'#37474f'; roundRect(ctx,sellT.x,sellT.y,sellT.w,sellT.h,8); ctx.fill();
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 20px Arial';
    ctx.fillText('Kaufen',buyT.x+tabW/2,tabY+29);
    ctx.fillText('Verkaufen',sellT.x+tabW/2,tabY+29);

    // grid area
    const gx0=px+30, gy0=tabY+tabH+24, cols=5, cellW=(pw-60-(cols-1)*16)/cols, cellH=120, gapX=16, gapY=16;
    this._shopSlots=[];
    let list=[];
    if(this.shopTab==='buy'){ list=SHOP_ITEMS.map(id=>({id,price:ITEM_DEFS[id].price})); }
    else {
      Inventory.items.forEach((it,i)=>list.push({id:it.id,count:it.count,invIdx:i,price:sellPrice(it.id),sell:true}));
      if(Inventory.weapon)list.push({id:Inventory.weapon,equip:'weapon',price:sellPrice(Inventory.weapon),sell:true});
      if(Inventory.armor)list.push({id:Inventory.armor,equip:'armor',price:sellPrice(Inventory.armor),sell:true});
    }
    const perPage=10;
    this._shopMaxScroll=Math.max(0, Math.ceil(list.length/cols)-2);
    this.shopScroll=clamp(this.shopScroll,0,this._shopMaxScroll);
    const start=this.shopScroll*cols;
    const page=list.slice(start,start+perPage);
    for(let i=0;i<page.length;i++){
      const entry=page[i];
      const r=Math.floor(i/cols), c=i%cols;
      const sx=gx0+c*(cellW+gapX), sy=gy0+r*(cellH+gapY);
      const slot={x:sx,y:sy,w:cellW,h:cellH,entry};
      this._shopSlots.push(slot);
      const def=ITEM_DEFS[entry.id];
      const hovered=this.mouseX>=sx&&this.mouseX<=sx+cellW&&this.mouseY>=sy&&this.mouseY<=sy+cellH;
      ctx.fillStyle=hovered?'#3a2f4f':'#2a2238'; roundRect(ctx,sx,sy,cellW,cellH,8); ctx.fill();
      ctx.strokeStyle=RARITY[def.rarity].color; ctx.lineWidth=2; roundRect(ctx,sx,sy,cellW,cellH,8); ctx.stroke();
      drawItemIcon(ctx,entry.id,sx+cellW/2-26,sy+8,52);
      ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 13px Arial';
      ctx.fillText(def.name.length>16?def.name.slice(0,15)+'…':def.name,sx+cellW/2,sy+76);
      ctx.fillStyle=RARITY[def.rarity].color; ctx.font='11px Arial';
      ctx.fillText(RARITY[def.rarity].name,sx+cellW/2,sy+92);
      ctx.fillStyle='#ffd700'; ctx.font='bold 14px Arial';
      ctx.fillText(entry.price+' Gold'+(entry.sell?' (Verk.)':''),sx+cellW/2,sy+110);
      if(entry.equip){ ctx.fillStyle='#90caf9'; ctx.font='10px Arial'; ctx.fillText('(ausgerüstet)',sx+cellW/2,sy+12); }
      if(entry.count>1){ ctx.fillStyle='#fff'; ctx.font='bold 12px Arial'; ctx.textAlign='right'; ctx.fillText('x'+entry.count,sx+cellW-6,sy+18); }
    }
    // scroll hint
    if(this._shopMaxScroll>0){ ctx.textAlign='center'; ctx.fillStyle='#aaa'; ctx.font='12px Arial';
      ctx.fillText('Mausrad / ↑↓ zum Scrollen  ('+(this.shopScroll+1)+'/'+(this._shopMaxScroll+1)+')',W/2,py+ph-58); }
    // close button
    const label=this._shopFromLevel?'Nächstes Level →':'Weiter spielen';
    this._shopCloseBtn={x:W/2-130,y:py+ph-44,w:260,h:36};
    ctx.fillStyle='#1976d2'; roundRect(ctx,this._shopCloseBtn.x,this._shopCloseBtn.y,260,36,8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
    ctx.fillText(label,W/2,py+ph-20);
  },
  clickShop(mx,my){
    if(this._shopCloseBtn && inRect(mx,my,this._shopCloseBtn)){ this.closeShop(); return; }
    if(this._shopTabs){
      if(inRect(mx,my,this._shopTabs.buy)){ this.shopTab='buy'; this.shopScroll=0; return; }
      if(inRect(mx,my,this._shopTabs.sell)){ this.shopTab='sell'; this.shopScroll=0; return; }
    }
    for(const slot of this._shopSlots){
      if(inRect(mx,my,slot)){
        const e=slot.entry;
        if(this.shopTab==='buy'){
          if(Inventory.gold>=e.price){
            if(Inventory.add(e.id)){ Inventory.gold-=e.price; addMessage(ITEM_DEFS[e.id].name+' gekauft!'); Sound.collectItem(); }
            else addMessage('Inventar voll!');
          } else addMessage('Zu teuer!');
        } else {
          if(e.equip==='weapon'){ Inventory.weapon=null; }
          else if(e.equip==='armor'){ Inventory.armor=null; }
          else {
            const it=Inventory.items[e.invIdx];
            if(it){ it.count--; if(it.count<=0)Inventory.remove(e.invIdx); }
          }
          Inventory.gold+=e.price; addMessage('+'+e.price+' Gold (verkauft)'); Sound.collectGold();
        }
        return;
      }
    }
  },
  openShop(fromLevel){
    this._shopFromLevel=!!fromLevel; this.shopTab='buy'; this.shopScroll=0; this.state='shop';
  },
  closeShop(){
    if(this._shopFromLevel){ this._shopFromLevel=false; this.nextLevel(); }
    else { this.state='play'; }
  },
  drawInventory(){
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
    const panelX=240, panelY=80, panelW=800, panelH=560;

    ctx.textAlign='center'; ctx.fillStyle='#ffd700'; ctx.font='bold 30px Arial';
    ctx.fillText('Inventar',panelX+panelW/2,panelY+44);
    ctx.font='bold 18px Arial'; ctx.fillStyle='#ffd700'; ctx.textAlign='right';
    ctx.fillText('Gold: '+Inventory.gold,panelX+panelW-30,panelY+44);

    this._invSlots=[]; this._equipSlots={};
    const eqX=panelX+36, eqY=panelY+90;
    ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='18px Arial';
    ctx.fillText('Ausrüstung',eqX,eqY);
    const wsl={x:eqX,y:eqY+16,w:80,h:80}; this._equipSlots.weapon=wsl;
    drawSlot(wsl,Inventory.weapon,'#90caf9');
    ctx.fillStyle='#aaa'; ctx.font='14px Arial'; ctx.fillText('Waffe',wsl.x+wsl.w+12,wsl.y+30);
    if(Inventory.weapon)ctx.fillText('+'+ITEM_DEFS[Inventory.weapon].atk+' ANG',wsl.x+wsl.w+12,wsl.y+52);
    const asl={x:eqX,y:eqY+120,w:80,h:80}; this._equipSlots.armor=asl;
    drawSlot(asl,Inventory.armor,'#a5d6a7');
    ctx.fillStyle='#aaa'; ctx.font='14px Arial'; ctx.fillText('Rüstung',asl.x+asl.w+12,asl.y+30);
    if(Inventory.armor)ctx.fillText('+'+ITEM_DEFS[Inventory.armor].def+' VER',asl.x+asl.w+12,asl.y+52);
    ctx.fillStyle='#888'; ctx.font='13px Arial';
    ctx.fillText('Klick: ausrüsten/benutzen',eqX,eqY+280);
    ctx.fillText('Klick auf Ausrüstung: ablegen',eqX,eqY+300);

    const gx0=panelX+320, gy0=panelY+100, cell=80, gap=10;
    let hover=-1;
    for(let r=0;r<5;r++)for(let cI=0;cI<4;cI++){
      const idx=r*4+cI;
      const sx=gx0+cI*(cell+gap), sy=gy0+r*(cell+gap);
      const slot={x:sx,y:sy,w:cell,h:cell,idx}; this._invSlots.push(slot);
      const it=Inventory.items[idx]; const def=it?ITEM_DEFS[it.id]:null;
      const hovered = this.mouseX>=sx&&this.mouseX<=sx+cell&&this.mouseY>=sy&&this.mouseY<=sy+cell;
      ctx.fillStyle = hovered?'#473a5c':'#3a3148'; roundRect(ctx,sx,sy,cell,cell,8); ctx.fill();
      if(def){
        ctx.strokeStyle=RARITY[def.rarity].color; ctx.lineWidth=2; roundRect(ctx,sx,sy,cell,cell,8); ctx.stroke();
        drawItemIcon(ctx,it.id,sx+8,sy+8,cell-16);
        if(it.count>1){ ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.textAlign='right'; ctx.fillText('x'+it.count,sx+cell-6,sy+cell-6); }
        if(hovered)hover=idx;
      }
    }
    if(hover>=0){
      const it=Inventory.items[hover], def=ITEM_DEFS[it.id];
      const tx=clamp(this.mouseX+12,0,W-260), ty=this.mouseY+12;
      ctx.fillStyle='rgba(0,0,0,0.92)'; roundRect(ctx,tx,ty,250,90,8); ctx.fill();
      ctx.strokeStyle=RARITY[def.rarity].color; roundRect(ctx,tx,ty,250,90,8); ctx.stroke();
      ctx.textAlign='left'; ctx.fillStyle=RARITY[def.rarity].color; ctx.font='bold 17px Arial';
      ctx.fillText(def.name,tx+12,ty+26);
      ctx.fillStyle='#bbb'; ctx.font='14px Arial'; ctx.fillText(RARITY[def.rarity].name,tx+12,ty+48);
      let stat='';
      if(def.type==='weapon')stat='+'+def.atk+' Angriff';
      else if(def.type==='armor')stat='+'+def.def+' Verteidigung';
      else if(def.heal)stat='Heilt '+def.heal+' HP';
      else if(def.buffAtk)stat='+'+def.buffAtk+' ANG (10s)';
      ctx.fillStyle='#fff'; ctx.fillText(stat,tx+12,ty+72);
    }
    ctx.textAlign='center'; ctx.fillStyle='#aaa'; ctx.font='14px Arial';
    ctx.fillText('I oder Tab zum Schließen',panelX+panelW/2,panelY+panelH-16);
  },
  clickInventory(mx,my){
    const es=this._equipSlots;
    if(es.weapon && inRect(mx,my,es.weapon)){
      if(Inventory.weapon){ if(Inventory.items.length<Inventory.maxSlots){ Inventory.add(Inventory.weapon); Inventory.weapon=null; addMessage('Waffe abgelegt'); } }
      return;
    }
    if(es.armor && inRect(mx,my,es.armor)){
      if(Inventory.armor){ if(Inventory.items.length<Inventory.maxSlots){ Inventory.add(Inventory.armor); Inventory.armor=null; addMessage('Rüstung abgelegt'); } }
      return;
    }
    for(const slot of this._invSlots){
      if(inRect(mx,my,slot)){
        const it=Inventory.items[slot.idx]; if(!it)return;
        const def=ITEM_DEFS[it.id];
        if(def.type==='weapon'){ const old=Inventory.weapon; Inventory.weapon=it.id; Inventory.remove(slot.idx); if(old)Inventory.add(old); addMessage(def.name+' ausgerüstet'); }
        else if(def.type==='armor'){ const old=Inventory.armor; Inventory.armor=it.id; Inventory.remove(slot.idx); if(old)Inventory.add(old); addMessage(def.name+' ausgerüstet'); }
        else if(def.type==='potion'){ this.usePotion(slot.idx); }
        return;
      }
    }
  },
  usePotion(idx){
    const it=Inventory.items[idx]; if(!it)return;
    const def=ITEM_DEFS[it.id]; if(def.type!=='potion')return;
    if(def.heal){ this.player.hp=clamp(this.player.hp+def.heal,0,this.player.maxHp); addFloater(this.player.x+20,this.player.y,'+'+def.heal,'#69f0ae'); addMessage(def.name+' benutzt'); Sound.collectItem(); }
    else if(def.buffAtk){ this.player.buffAtk=def.buffAtk; this.player.buffTimer=def.buffTime; addMessage('Stärketrank aktiv!'); Sound.collectItem(); }
    it.count--; if(it.count<=0)Inventory.remove(idx);
  },
  quickPotion(n){
    const potionIdxs=[];
    Inventory.items.forEach((it,i)=>{ if(ITEM_DEFS[it.id].type==='potion')potionIdxs.push(i); });
    if(potionIdxs[n-1]!==undefined)this.usePotion(potionIdxs[n-1]);
  },
};

function inRect(mx,my,r){ return mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h; }
function drawSlot(s,id,color){
  ctx.fillStyle='#3a3148'; roundRect(ctx,s.x,s.y,s.w,s.h,8); ctx.fill();
  ctx.strokeStyle=id?RARITY[ITEM_DEFS[id].rarity].color:color; ctx.lineWidth=2; roundRect(ctx,s.x,s.y,s.w,s.h,8); ctx.stroke();
  if(id)drawItemIcon(ctx,id,s.x+8,s.y+8,s.w-16);
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// ---------- Input ----------
const keys={left:false,right:false};
function ensureAudio(){ Sound.init(); if(Sound.ctx&&Sound.ctx.state==='suspended')Sound.ctx.resume(); }

window.addEventListener('keydown',e=>{
  ensureAudio();
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','tab'].includes(k))e.preventDefault();
  if(k==='arrowleft'||k==='a')keys.left=true;
  if(k==='arrowright'||k==='d')keys.right=true;
  if(Game.state==='play'){
    if(k==='arrowup'||k==='w'||k===' ')Game.player.jump();
    if(k==='z'||k==='x')Game.player.attack();
    if(k>='1'&&k<='5')Game.quickPotion(parseInt(k));
    if(k==='s')Game.openShop(false);
  } else if(Game.state==='shop'){
    if(k==='arrowup'||k==='w')Game.shopScroll=clamp(Game.shopScroll-1,0,Game._shopMaxScroll||0);
    if(k==='arrowdown'){ /* handled below */ }
    if(k==='s'&&!Game._shopFromLevel)Game.closeShop();
  }
  if(Game.state==='shop'&&(k==='arrowdown')){ Game.shopScroll=clamp(Game.shopScroll+1,0,Game._shopMaxScroll||0); }
  if((k==='i'||k==='tab')){
    if(Game.state==='play')Game.state='inventory';
    else if(Game.state==='inventory')Game.state='play';
  }
  if((k==='enter'||k===' ')){
    if(Game.state==='menu')Game.startGame();
    else if(Game.state==='gameover'||Game.state==='victory')Game.startGame();
  }
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.left=false;
  if(k==='arrowright'||k==='d')keys.right=false;
});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  Game.mouseX=(e.clientX-r.left)*(W/r.width); Game.mouseY=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('wheel',e=>{
  if(Game.state==='shop'){ e.preventDefault(); Game.shopScroll=clamp(Game.shopScroll+(e.deltaY>0?1:-1),0,Game._shopMaxScroll||0); }
},{passive:false});
canvas.addEventListener('click',e=>{
  ensureAudio();
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  if(Game.state==='menu'){ if(Game._startBtn&&inRect(mx,my,Game._startBtn))Game.startGame(); }
  else if(Game.state==='gameover'||Game.state==='victory'){ if(Game._restartBtn&&inRect(mx,my,Game._restartBtn))Game.startGame(); }
  else if(Game.state==='inventory'){ Game.clickInventory(mx,my); }
  else if(Game.state==='shop'){ Game.clickShop(mx,my); }
  else if(Game.state==='play'){
    if(mx>W-64&&mx<W-20&&my>52&&my<96)Game.state='inventory';
    else if(Game._shopBtn&&inRect(mx,my,Game._shopBtn))Game.openShop(false);
  }
});

// ---------- Loop ----------
function loop(){ Game.update(); Game.render(); requestAnimationFrame(loop); }
loop();
</script>
